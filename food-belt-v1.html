<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffefdc"><title>美食街輸送帶 V1｜五十音之路</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#f8e7da;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#604b4d}button{font:inherit;touch-action:manipulation;cursor:pointer}#game{width:min(480px,100%);height:100%;margin:auto;display:flex;flex-direction:column;min-height:0;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom);background:linear-gradient(#ffe5d9,#fff8e6);overflow:hidden}
header{display:flex;align-items:center;gap:9px;flex-shrink:0;padding:7px 5px}header a{font-size:12px;text-decoration:none;color:#985d69;background:#fff7ee;border-radius:12px;padding:9px}header div{flex:1;min-width:0}header small{font-size:10px;font-weight:800;letter-spacing:.8px;color:#b37587}header h1{font-size:clamp(17px,2.8dvh,22px);margin:0}header .pause{border:0;border-radius:12px;padding:8px;background:#fff2e6}
.progress{display:flex;align-items:center;justify-content:space-between;gap:7px;background:#fff7e9;border:1px solid #f0d3bf;border-radius:13px;padding:8px 10px;font-weight:800;font-size:12px;flex-shrink:0}.progress #dots{color:#e37990;letter-spacing:2px}
.task{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 2px;border-radius:16px;background:#fffefa;border:2px solid #f4cbd1;padding:9px;min-height:76px}.task span{font-size:clamp(43px,8dvh,62px)}.task strong{font-size:clamp(16px,3dvh,22px);display:block}.task small{display:block;color:#b47389;font-size:11px}
.scene{position:relative;flex:1;min-height:0;overflow:hidden;border:3px solid white;border-radius:20px;background:linear-gradient(#a5def7 0%,#d4edf7 47%,#d9ab80 48%,#b77e5f 100%);box-shadow:inset 0 -12px 30px #663d4333}
.shopTop{position:absolute;top:0;width:100%;height:45%;background:linear-gradient(#9c6354 0 11%,transparent 11%);overflow:hidden;pointer-events:none}.shopTop:before{content:"";position:absolute;inset:20% -8% 0;background:linear-gradient(95deg,#c48b6b 0 11%,#fff0d7 11% 24%,#bf765e 24% 36%,#fff3d8 36% 62%,#bd7869 62% 74%,#f3d3af 74% 91%,#a86b59 91%);opacity:.6}.lanterns{position:absolute;top:10%;width:100%;text-align:center;font-size:clamp(22px,4.6dvh,35px);letter-spacing:12px}.clerk{position:absolute;bottom:43%;right:8%;font-size:clamp(38px,8dvh,61px);filter:drop-shadow(0 4px 4px #694c4955)}
.sign{position:absolute;top:23%;left:4%;padding:7px 10px;background:#fff2de;border:3px solid #c18a72;border-radius:12px;font-size:12px;font-weight:900;color:#965d56;transform:rotate(-3deg)}.belt{position:absolute;left:0;right:0;top:53%;height:33%;background:repeating-linear-gradient(90deg,#4c4146 0 26px,#65565a 26px 48px,#9c8787 48px 53px);border-top:13px solid #efd1ad;border-bottom:14px solid #af775f;box-shadow:0 12px 0 #8c5c50;overflow:hidden}.belt::after{content:"";position:absolute;inset:5px 0 0;background:repeating-linear-gradient(90deg,transparent 0 55px,#ffffff28 55px 58px);pointer-events:none}
.item{position:absolute;top:50%;width:clamp(69px,20vw,93px);height:clamp(79px,16dvh,106px);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;border:3px solid #faf4e9;border-radius:50%;background:#f9e6c0;box-shadow:0 6px #a88068,0 9px 12px #2d252342;will-change:left}.item b{font-size:clamp(33px,6dvh,53px);line-height:1.1}.item small{font-size:11px;font-weight:900;color:#8b5960}
.pickZone{position:absolute;left:50%;top:49%;width:clamp(105px,30vw,140px);height:39%;transform:translateX(-50%);border:4px dashed #ffe77b;border-radius:19px;box-shadow:0 0 0 4px #d2755344,0 0 23px #ffef8c;pointer-events:none}.pickZone:after{content:"⬇ 拿取區";position:absolute;top:-31px;left:-5px;right:-5px;background:#fff0c1;color:#aa6b4e;border-radius:12px;text-align:center;font-size:13px;font-weight:900;padding:5px}
.basket{position:absolute;right:3%;bottom:2%;font-size:clamp(23px,5dvh,34px);text-align:right}.basket small{display:block;border-radius:8px;background:#ffeed6ee;font-weight:900;font-size:11px;padding:4px}.collect{position:absolute;z-index:6;left:50%;top:55%;font-size:55px;transform:translate(-50%,-50%);animation:fly .6s ease-in forwards;pointer-events:none}@keyframes fly{to{left:84%;top:92%;opacity:0;transform:scale(.3)}}
.feedback{flex-shrink:0;text-align:center;min-height:32px;padding:8px 5px 3px;font-size:12px;font-weight:900;color:#8d5a70}.actions{flex-shrink:0;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:7px;padding:5px 0}.actions button{min-height:clamp(44px,8dvh,67px);border:2px solid white;border-radius:15px;font-weight:900;font-size:clamp(12px,2.4dvh,16px);background:#fff5ec;color:#8c6270}.actions #take{background:linear-gradient(#f8a5b3,#e46c88);font-size:clamp(18px,3.4dvh,25px);color:white;box-shadow:0 4px #b55572}.actions #take:disabled{opacity:.5}.footer{font-size:10px;color:#9b7d73;text-align:center;padding-bottom:4px}
.overlay{display:none;position:absolute;inset:0;background:#fff9e9eF;z-index:10;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;gap:12px}.overlay.show{display:flex}.overlay strong{font-size:25px}.overlay p{font-size:13px;line-height:1.6}.overlay button{padding:13px 20px;border:0;border-radius:13px;background:#ef819d;color:white;font-weight:900}.scene.paused .item{filter:grayscale(.6)}@media(max-height:610px){header{padding:2px 5px}.task{min-height:54px;margin:4px 2px;padding:3px}.task span{font-size:36px}.progress{padding:5px 8px}.feedback{min-height:22px;padding:3px}.actions button{min-height:39px}.footer{display:none}.clerk{bottom:42%}}
</style></head><body><main id="game"><header><a href="./">‹ 正式版</a><div><small>FOOD MARKET · PLAYABLE V1</small><h1>🍣 美食街輸送帶</h1></div><button class="pause" id="pause">⏸</button></header><div class="progress"><span>第 1 關｜看圖拿物品</span><span id="dots">○ ○ ○ ○ ○ ○</span><span id="count">0 / 6</span></div><div class="task"><span id="targetPic">🍎</span><div><small id="taskType">看日文，拿正確物品</small><strong id="targetName">りんご</strong></div></div><div class="scene" id="scene"><div class="shopTop"><div class="lanterns">🏮 🌸 🏮 🌸 🏮</div></div><div class="sign">🌸 日本美食小店</div><div class="clerk">👩🏻‍🍳</div><div class="belt" id="belt"></div><div class="pickZone"></div><div class="basket">🧺<small id="basketText">已獲得 0 件</small></div><div class="overlay" id="overlay"><div style="font-size:56px">🏆🧺🌸</div><strong>採購挑戰完成！</strong><p id="result"></p><button id="again">再玩一次</button><a href="./" style="color:#976c79;font-size:12px">返回正式版</a></div></div><div class="feedback" id="feedback" aria-live="polite">等正確餐盤到達中央，按「拿取」！</div><div class="actions"><button id="speak">🔊 重聽</button><button id="take">✋ 拿取</button><button id="slower">🐢 慢速</button></div><div class="footer">6 題交錯日文／聽力・額外干擾物僅用於辨認・不影響正式進度</div></main><script>
(()=>{
const root=document.getElementById('game'),$=id=>root.querySelector('#'+id);
const words=[{jp:'みず',zh:'水',e:'💧'},{jp:'すし',zh:'壽司',e:'🍣'},{jp:'りんご',zh:'蘋果',e:'🍎'},{jp:'ごはん',zh:'飯',e:'🍚'},{jp:'パン',zh:'麵包',e:'🍞'},{jp:'おちゃ',zh:'茶',e:'🍵'}];
const extras=[{jp:'たまご',zh:'雞蛋',e:'🥚'},{jp:'バナナ',zh:'香蕉',e:'🍌'},{jp:'ケーキ',zh:'蛋糕',e:'🍰'},{jp:'コーヒー',zh:'咖啡',e:'☕'},{jp:'ピザ',zh:'披薩',e:'🍕'},{jp:'にく',zh:'肉',e:'🍖'},{jp:'さかな',zh:'魚',e:'🐟'},{jp:'アイス',zh:'冰淇淋',e:'🍨'}];const catalog=[...words,...extras];
let index=0,correct=0,miss=0,paused=false,locked=false,ended=false,slow=false,items=[],last=0,frame=0,feedbackTimer=0,questionMode='text',lastSeq=[],lastTakeWasWrong=false;
const order=[2,0,1,4,5,3];
function speak(){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(words[order[index]].jp);u.lang='ja-JP';u.rate=.75;speechSynthesis.speak(u)}catch{}}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function fill(){const target=order[index];items=[];let pool=shuffle([...Array(catalog.length).keys()].filter(id=>id!==target));let sequence=pool.slice(0,8);const slot=2+Math.floor(Math.random()*4);sequence.splice(slot,0,target);sequence.push(...shuffle(pool.slice(8)).slice(0,2));lastSeq=sequence;sequence.forEach((id,i)=>{const el=document.createElement('div');el.className='item';el.innerHTML='<b>'+catalog[id].e+'</b>';el.setAttribute('aria-label',catalog[id].zh);$('belt').append(el);items.push({id,el,x:110+i*136})})}
function resetRound(){clearTimeout(feedbackTimer);$('belt').replaceChildren();fill();locked=false;paused=false;last=0;$('pause').textContent='⏸';$('scene').classList.remove('paused');questionMode=index%2===0?'text':'audio';$('targetPic').textContent=questionMode==='text'?'📖':'🔊';$('targetName').textContent=questionMode==='text'?words[order[index]].jp:'聽音選物品';$('taskType').textContent=questionMode==='text'?'看日文，拿正確物品':'聽日文，拿正確物品';$('count').textContent=correct+' / 6';$('dots').textContent=Array.from({length:6},(_,i)=>i<correct?'●':'○').join(' ');$('feedback').textContent='找準輸送帶中央的物品，再按「拿取」！';$('take').disabled=false;if(questionMode==='audio')setTimeout(()=>{if(!paused&&!ended&&!locked&&questionMode==='audio')speak()},350)}
function take(){if(paused||locked||ended)return;const width=$('belt').getBoundingClientRect().width;const center=width/2;let nearest=items.reduce((a,b)=>Math.abs(b.x-center)<Math.abs(a.x-center)?b:a,items[0]);if(!nearest)return;const distance=Math.abs(nearest.x-center);if(distance>69){$('feedback').textContent='⏳ 還沒對準拿取區，再等一下！';return}locked=true;$('take').disabled=true;const expected=order[index],ok=nearest.id===expected;if(ok){correct++;$('basketText').textContent='已獲得 '+correct+' 件';$('feedback').textContent='✨ 正確！'+words[expected].jp+'＝'+words[expected].zh;const fx=document.createElement('div');fx.className='collect';fx.textContent=words[expected].e;$('scene').append(fx);setTimeout(()=>fx.remove(),700)}else{miss++;$('feedback').textContent='💡 拿錯囉！請找 '+words[expected].jp+'（'+words[expected].zh+'）'}feedbackTimer=setTimeout(()=>{if(ok){index++;if(index===order.length){finish();return}resetRound()}else{resetRound()}},1100)}
function finish(){ended=true;paused=true;$('take').disabled=true;$('overlay').classList.add('show');$('result').textContent='完成六道題目，途中拿錯 '+miss+' 次。這是輸送帶操作手感測試版；正式版會加入三關記憶評量。'}
function restart(){index=0;correct=0;miss=0;ended=false;slow=false;$('slower').textContent='🐢 慢速';$('basketText').textContent='已獲得 0 件';$('overlay').classList.remove('show');resetRound()}
function animate(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(!paused&&!locked&&!ended){const w=$('belt').getBoundingClientRect().width;items.forEach(it=>{it.x-=(slow?55:88)*dt;if(it.x<-70)it.x+=items.length*136;it.el.style.left=it.x+'px'})}frame=requestAnimationFrame(animate)}
$('take').addEventListener('click',take);$('speak').addEventListener('click',speak);$('slower').addEventListener('click',()=>{slow=!slow;$('slower').textContent=slow?'🐇 正常速':'🐢 慢速'});$('pause').addEventListener('click',()=>{if(ended)return;paused=!paused;$('pause').textContent=paused?'▶️':'⏸';$('scene').classList.toggle('paused',paused);if(paused)$('feedback').textContent='⏸ 已暫停';else $('feedback').textContent='▶️ 繼續拿取！'});$('again').addEventListener('click',restart);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!ended){paused=true;$('pause').textContent='▶️'}});resetRound();frame=requestAnimationFrame(animate);
})();
</script></body></html>
