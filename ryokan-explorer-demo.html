*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#694b37;background:#efe2cb}button{font:inherit;touch-action:manipulation;cursor:pointer}main{max-width:520px;height:100dvh;margin:auto;padding:max(8px,env(safe-area-inset-top)) 9px max(9px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;background:linear-gradient(#f8ead5,#e8c6ad)}header{display:flex;align-items:center;gap:10px;flex:none}h1{font-size:19px;margin:0}.sub{font-size:10px;color:#947b69}.back{border:0;background:#fff8ec;color:#785940;border-radius:10px;text-decoration:none;padding:9px;font-weight:800;font-size:12px}.mute{margin-left:auto;border:0;background:#fff6e7;border-radius:9px;padding:8px}.tabs{display:flex;gap:5px;overflow-x:auto;flex:none}.tabs button{flex:none;border:1px solid #dbc3a9;background:#fff7e9;border-radius:10px;padding:7px;font-size:11px;font-weight:900;color:#846449}.tabs button.active{background:#9e6544;color:white}.stats{display:flex;align-items:center;justify-content:space-between;background:#fff7e7;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:900}.progress{height:5px;background:#d7beaa;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#8ba86d;width:0;transition:width .3s}.room{position:relative;overflow:hidden;flex:1;min-height:270px;border:3px solid #fff5e5;border-radius:16px;background:linear-gradient(180deg,#e8d7b8 0 37%,#bd8e65 37% 43%,#e7c99c 43% 100%);box-shadow:0 6px 16px #68452e3d}.room:before{content:"";position:absolute;left:14%;right:14%;top:6%;height:39%;border:11px solid #986848;background:linear-gradient(180deg,#c5dfea,#f9c8af 62%,#7db0a5 63%);box-shadow:0 0 0 4px #efe0c9,0 0 0 100vw #e7d3b033;opacity:.88}.room:after{content:"";position:absolute;left:50%;top:4%;height:39%;border-left:9px solid #956b49;pointer-events:none}.floor{position:absolute;inset:58% -15% -20%;transform:perspective(290px) rotateX(32deg);border:11px solid #9a805e;background:repeating-linear-gradient(90deg,#e0d3ad 0 105px,#aa9876 106px 112px,#ded0aa 113px 223px)}.roomLabel{position:absolute;top:9px;left:9px;border-radius:20px;background:#fff8e5eb;padding:6px 10px;font-size:12px;font-weight:900;z-index:2}.items{position:absolute;inset:0;z-index:3}.item{position:absolute;width:25%;height:13%;min-height:50px;max-height:76px;border:2px solid #fff7e7;border-radius:14px;background:#fffcf2df;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 3px 0 #785a4599,0 5px 13px #4f302b35;transform:translate(-50%,-50%)}.item:nth-child(1){left:24%;top:28%}.item:nth-child(2){left:75%;top:28%}.item:nth-child(3){left:24%;top:53%}.item:nth-child(4){left:75%;top:53%}.item:nth-child(5){left:24%;top:79%}.item:nth-child(6){left:75%;top:79%}.item .ico{font-size:clamp(25px,4dvh,38px)}.item .jp{display:none;font-size:10px;font-weight:900}.item.correct{background:#def4db;border-color:#6bb681;animation:pop .26s}.item.correct .jp{display:block}.item.wrong{background:#ffdad5;border-color:#d97a6a;animation:shake .23s}.bottom{background:#fff9ef;border-radius:15px;padding:9px;border:1px solid white;flex:none}.question{font-size:14px;font-weight:900;text-align:center}.hint{text-align:center;font-size:11px;margin-top:5px;color:#927968}.feedback{text-align:center;color:#6b995f;min-height:17px;margin-top:5px;font-size:12px;font-weight:900}.actions{display:flex;gap:8px;margin-top:5px}.actions button{flex:1;border:0;border-radius:10px;background:#e4ebdf;padding:11px 6px;font-weight:900;color:#607659;font-size:12px}.actions button:last-child{background:#a76f4f;color:white}.actions button:disabled{opacity:.4}small.foot{text-align:center;color:#917966;font-size:10px}@keyframes shake{30%{transform:translate(calc(-50% - 5px),-50%)}70%{transform:translate(calc(-50% + 5px),-50%)}}@keyframes pop{55%{transform:translate(-50%,-50%) scale(1.09)}}@media(max-height:680px){main{gap:4px}h1{font-size:16px}.room{min-height:240px}.bottom{padding:7px}.actions button{padding:8px}.tabs button{padding:6px}.foot{display:none}}
</style></head><body><main><header><a class="back" href="./?v=18">‹ 小鎮</a><div><div class="sub">RYOKAN EXPLORER · 第一關</div><h1>♨️ 旅館尋物</h1></div><button id="mute" class="mute">🔔</button></header><nav class="tabs" id="tabs"></nav><div class="stats"><span id="counter">第 1 / 6 題</span><span id="score">答對 0 題</span></div><div class="progress"><i id="bar"></i></div><section class="room"><div class="floor"></div><span class="roomLabel" id="sceneLabel">🛏️ 客房探索</span><div class="items" id="items"></div></section><div class="bottom"><div class="question" id="question">聽日文，尋找正確物品</div><div class="hint" id="hint">先點播放日文，再點選場景中的物品</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button id="speak">🔊 播放日文</button><button id="next" disabled>下一題 ›</button></div></div><small class="foot">♨️ 第一關操作測試版｜原有單字熟悉度紀錄</small></main><script>
const groups=[{"label":"房間與設備","scene":"🛏️ 客房探索","items":[["ホテル","飯店","🏨"],["へや","房間","🚪"],["かぎ","鑰匙","🗝️"],["ベッド","床","🛏️"],["エアコン","空調","❄️"],["れいぞうこ","冰箱","🧊"]]},{"label":"盥洗用品","scene":"🛁 浴室探索","items":[["タオル","毛巾","🧺"],["せっけん","肥皂","🧼"],["シャンプー","洗髮精","🧴"],["はぶらし","牙刷","🪥"],["ドライヤー","吹風機","💨"],["かがみ","鏡子","🪞"]]},{"label":"住宿流程","scene":"🛎️ 旅館大廳","items":[["よやく","預約","📅"],["チェックイン","入住","🛎️"],["チェックアウト","退房","🧳"],["うけつけ","櫃檯","🏮"],["なまえ","名字","📛"],["パスポート","護照","🛂"]]},{"label":"溫泉與館內設施","scene":"♨️ 館內導覽","items":[["おんせん","溫泉","♨️"],["おふろ","浴池／泡澡","🛁"],["だいよくじょう","大浴場","♨️"],["ろてんぶろ","露天浴池","🌌"],["エレベーター","電梯","🛗"],["しょくどう","餐廳","🍽️"]]}],$=id=>document.getElementById(id);let batch=Math.max(0,Math.min(3,Number(new URLSearchParams(location.search).get('group'))||0)),idx=0,done=false,correct=0,muted=false,ctx=null,speech=null;const words=()=>groups[batch].items;const order=[3,0,5,1,4,2];
function effect(ok){if(muted)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ctx=ctx||new A();if(ctx.state==='suspended')ctx.resume();(ok?[[659,0],[784,.12],[1047,.24]]:[[330,0],[247,.16]]).forEach(([f,d])=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+d;o.frequency.value=f;o.type=ok?'sine':'triangle';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.17)})}catch(e){}}
function record(ok,jp){try{const all=JSON.parse(localStorage.getItem('kanaRunnerTownWordV1')||'{}'),key='ryokan-'+batch+'-'+jp;const r=all[key]||{ok:[0,0,0],wrong:[0,0,0],hint:0};r.ok=Array.isArray(r.ok)?r.ok:[0,0,0];r.wrong=Array.isArray(r.wrong)?r.wrong:[0,0,0];const a=ok?r.ok:r.wrong;a[0]=(a[0]||0)+1;r.last=Date.now();all[key]=r;localStorage.setItem('kanaRunnerTownWordV1',JSON.stringify(all))}catch(e){}}
function speak(){try{if(!speechSynthesis)throw Error();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(words()[order[idx]][0]);u.lang='ja-JP';u.rate=.83;u.volume=.78;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speech=u;speechSynthesis.speak(u)}catch(e){$('hint').textContent='日文：'+words()[order[idx]][0]}}
function pick(i,b){if(done)return;const w=words()[order[idx]],ok=i===order[idx];record(ok,w[0]);effect(ok);if(!ok){b.classList.add('wrong');$('feedback').textContent='再試一次！';setTimeout(()=>b.classList.remove('wrong'),450);return}done=true;correct++;b.classList.add('correct');b.querySelector('.jp').textContent=w[0];$('question').textContent='✅ '+w[0]+' · '+w[1];$('feedback').textContent='找到了！';$('score').textContent='答對 '+correct+' 題';$('next').disabled=false;$('next').textContent=idx===5?'完成第一關 ✓':'下一題 ›'}
function draw(){done=false;$('counter').textContent='第 '+(idx+1)+' / 6 題';$('score').textContent='答對 '+correct+' 題';$('bar').style.width=idx/6*100+'%';$('sceneLabel').textContent=groups[batch].scene;$('question').textContent='🔊 聽日文，尋找正確目標';$('hint').textContent='先點播放日文，再點選場景中的物品';$('feedback').textContent='';$('next').disabled=true;$('next').textContent='下一題 ›';const host=$('items');host.replaceChildren();words().forEach((w,i)=>{const b=document.createElement('button');b.className='item';b.innerHTML='<span class="ico">'+w[2]+'</span><span class="jp"></span>';b.setAttribute('aria-label','選項 '+(i+1));b.onclick=()=>pick(i,b);host.append(b)});const tabs=$('tabs');tabs.replaceChildren();groups.forEach((g,i)=>{const b=document.createElement('button');b.textContent='ABCD'[i]+' '+g.label;b.className=i===batch?'active':'';b.onclick=()=>{batch=i;idx=0;correct=0;history.replaceState(null,'','?group='+i+'&v=1');draw()};tabs.append(b)})}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔕':'🔔'};$('speak').onclick=speak;
$('next').onclick=()=>{if(!done)return;if(idx===5){$('bar').style.width='100%';$('question').textContent='🎉 第一關完成！';$('hint').textContent='第二關「旅館服務任務」及第三關「入住登記簿」將接續製作。';$('next').disabled=true;return}idx++;draw()};draw();
</script></body></html>
