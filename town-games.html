function frame(t){if(sid!==session)return;let dt=Math.min(t-previous||16,48);previous=t;if(!paused){elapsed+=dt;const width=sky.clientWidth;const speed=Math.min(.15,.07+index*.012);for(let o of [...active]){o.x+=dt*speed;o.node.style.left=o.x+'px';if(o.x>width+15)remove(o)}
// A single active badge may enter the crosshair corridor; spawning is delayed until the preceding badge has cleared it.
if(elapsed>=nextSpawn&&active.length<4){spawn();nextSpawn=elapsed+Math.max(1650,2300-index*110)}
}anim=requestAnimationFrame(frame)}
function fire(){if(locked||sid!==session)return;const gun=$('cannon');gun.classList.remove('firing');void gun.offsetWidth;gun.classList.add('firing');
// A small dark cannonball travels straight upward across all four lanes.
const ball=document.createElement('span');ball.className='cannonBall fly';sky.append(ball);ball.addEventListener('animationend',()=>ball.remove(),{once:true});
setTimeout(()=>ball.remove(),600);
let center=sky.clientWidth/2,near=active.filter(o=>Math.abs(o.x+o.node.offsetWidth/2-center)<36).sort((a,b)=>Math.abs(a.x+a.node.offsetWidth/2-center)-Math.abs(b.x+b.node.offsetWidth/2-center))[0];
if(!near){sound(false);message('等待假名通過虛線準星！');return}
remove(near);if(near.letter===chars[spell]){sound(true);points+=10;spell++;message('✨ 命中！');refresh();if(spell>=chars.length){locked=true;cancelAnimationFrame(anim);anim=0;active.forEach(o=>o.node.remove());active=[];say(item[0]);message('🎉 拼字成功：'+item[0]);$('next').hidden=false}}else{lives--;sound(false);message(lives>0?'不是這個假名，繼續加油！':'❤️ 用完了，重新挑戰這題！');refresh();if(lives<=0){locked=true;cancelAnimationFrame(anim);anim=0;setTimeout(()=>{if(sid===session)render()},900)}}}
$('fire').onclick=fire;refresh();spawn();nextSpawn=2000;anim=requestAnimationFrame(frame);say(item[0])
}$('nextLevel').onclick=()=>setLevel(Math.min(2,level+1));$('gotIt').onclick=()=>{$('onboard').hidden=true;try{localStorage.setItem('townGamesOnboard','1')}catch(e){}};try{if(!localStorage.getItem('townGamesOnboard'))$('onboard').hidden=false}catch(e){}document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>setArea(b.dataset.area));document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>setLevel(+b.dataset.level));$('listen').onclick=()=>say(sets[area][index][0]);$('restart').onclick=reset;$('next').onclick=next;setArea(area);
