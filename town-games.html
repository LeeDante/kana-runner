<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日文小鎮｜公園與住宅</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf7f3;font-family:system-ui,"Noto Sans TC",sans-serif;color:#263c43}main{max-width:850px;margin:auto;padding:16px}header,.panel{background:white;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #2342}h1{font-size:23px;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{border:0;border-radius:12px;background:#e6eff2;color:#18394b;font:inherit;padding:12px;cursor:pointer;text-decoration:none;min-height:44px}button.sel,.primary{background:#267a83;color:white}button:disabled{opacity:.5}#arena{position:relative;overflow:hidden;min-height:280px;background:linear-gradient(#d8f3ff,#d5eebd);border-radius:17px;padding:12px;margin:12px 0}#prompt{font-weight:750;font-size:20px}#status{min-height:28px;font-weight:700}#holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:20px}.mole{height:85px;background:#a77755;color:white;border-radius:50% 50% 24% 24%;font-size:36px;box-shadow:inset 0 -12px #79503a}.mole small{display:block;font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{height:77px;background:#28698c;color:white;font-size:24px}.card.open,.card.done{background:white;color:#244}.card.done{outline:3px solid #65b785}.slots{text-align:center;font-size:31px;font-weight:800;letter-spacing:8px;padding:14px}.flight{height:160px;position:relative;overflow:hidden;background:#bce6ff;border-radius:14px}.cross{position:absolute;left:50%;top:0;height:100%;border-left:3px dashed #e75963}.target{position:absolute;font-size:29px;white-space:nowrap;top:55px}.actions{display:flex;gap:8px;flex-wrap:wrap}#fire{display:block;margin:14px auto;font-size:22px;min-width:160px}small{color:#586d78}@media(max-width:450px){.card{height:66px;font-size:21px}.target{font-size:25px}}

/* Mobile-first layout, 320px and up */
html{width:100%;overflow-x:hidden}body{width:100%;min-width:0;overflow-x:hidden}
main{width:100%;max-width:850px;padding:clamp(8px,3vw,16px)}
header,.panel{min-width:0;padding:clamp(10px,3vw,16px);margin:8px 0;border-radius:16px}
.row{min-width:0;display:flex;flex-wrap:wrap;gap:6px}.row>*{min-width:0}
button,a.btn{max-width:100%;overflow-wrap:anywhere;padding:10px 9px}
h1{font-size:clamp(18px,5vw,23px)}#arena{min-width:0;max-width:100%;min-height:0;padding:clamp(6px,2vw,12px);overflow:hidden}
#prompt{font-size:clamp(16px,4.4vw,20px)}#holes{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(5px,2vw,12px);padding-top:12px}
.mole{min-width:0;width:100%;height:clamp(67px,22vw,95px);font-size:clamp(27px,9vw,40px);padding:4px}
.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.card{min-width:0;height:clamp(62px,19vw,86px);font-size:clamp(18px,6vw,25px);padding:4px}
.flight{width:100%;min-width:0;height:150px}.slots{font-size:clamp(22px,7vw,31px);letter-spacing:3px;overflow-wrap:anywhere}
.target{font-size:clamp(22px,6vw,29px)}#fire{width:min(100%,230px);min-height:54px}
#levelTabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
#levelTabs button{min-width:0;padding:9px 3px;font-size:clamp(11px,3.25vw,15px);line-height:1.3;position:relative}
#levelTabs button .badge{display:block;font-size:11px;margin-top:3px;opacity:.9}
#levelTabs button.done:not(.sel){background:#d7f3df;color:#215f3c}
#levelGuide{font-size:13px;color:#41656b;margin:8px 0 0}
#onboard{border:2px solid #89c7b9;background:#f2fff8;border-radius:12px;padding:12px;margin:10px 0;font-size:14px}
#onboard[hidden]{display:none}#onboard button{background:#267a83;color:white;margin-top:8px}
#nextLevel{background:#267a83;color:white}
@media(min-width:650px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style><main><header><h1>🏘️ 日文小鎮｜生活遊戲</h1><div class="row"><a class="btn" href="./index.html">← 返回小鎮</a><button data-area="park" class="sel">🌳 公園</button><button data-area="home">🏠 住宅</button></div></header><section class="panel"><div class="row" id="levelTabs"><button data-level="0" class="sel">① 打地鼠</button><button data-level="1">② 翻牌配對</button><button data-level="2">③ 假名射擊</button></div><p id="levelGuide">👆 點上方關卡可自由切換玩法</p><div id="onboard" hidden><strong>🎮 三種玩法，自由挑戰！</strong><div>點選上方關卡就能隨時切換；建議從第一關開始，完成後也會提示下一關。</div><button id="gotIt">知道了，開始玩！</button></div><p id="score"></p><div id="prompt"></div><small id="hint"></small><div id="arena"></div><p id="status" aria-live="polite"></p><div class="actions"><button id="listen">🔊 聽日文</button><button id="restart">↻ 重玩</button><button class="primary" id="next">下一題 →</button><button id="nextLevel" hidden>挑戰下一關 →</button></div></section></main><script>
const sets={park:[['さくら','🌸'],['いぬ','🐶'],['ねこ','🐱'],['はな','🌼'],['き','🌳'],['とり','🐦']],home:[['いす','🪑'],['ほん','📚'],['とけい','🕒'],['かぎ','🔑'],['まど','🪟'],['くつ','👟']]};let area=new URLSearchParams(location.search).get('area')==='home'?'home':'park',level=0,index=0,points=0,locked=false,flipped=[],matched=new Set(),anim=0,flightItems=[],last=0,spell=0,session=0;const $=x=>document.getElementById(x),rand=n=>Math.floor(Math.random()*n),shuffle=a=>a.sort(()=>Math.random()-.5);function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.78;u.volume=.7;speechSynthesis.speak(u)}function sound(ok){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?660:240;g.gain.value=.05;o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch(e){}}function message(s){$('status').textContent=s}function stop(){cancelAnimationFrame(anim);anim=0;session++}function reset(){stop();index=0;points=0;render()}function progressKey(){return 'townGamesProgress-'+area}function getProgress(){try{return JSON.parse(localStorage.getItem(progressKey())||'{}')}catch(e){return {}}}function complete(){let p=getProgress();p[level]=true;try{localStorage.setItem(progressKey(),JSON.stringify(p))}catch(e){}updateTabs();$('nextLevel').hidden=level===2}function updateTabs(){let p=getProgress();document.querySelectorAll('[data-level]').forEach(b=>{let n=+b.dataset.level;b.classList.toggle('done',!!p[n]);b.classList.toggle('sel',n===level);b.setAttribute('aria-pressed',String(n===level));let labels=['① 打地鼠','② 翻牌','③ 假名射擊'];b.innerHTML=labels[n]+'<span class="badge">'+(n===level?'▶ 正在玩':p[n]?'✓ 已完成':'☆ 可挑戰')+'</span>'})}function next(){stop();if(level===1){setLevel(2);return}if(index===sets[area].length-1){complete();message('🎉 本關完成！可選擇下一關或重玩。');$('next').hidden=true;return}index++;render()}function setArea(a){area=a;document.querySelectorAll('[data-area]').forEach(b=>b.classList.toggle('sel',b.dataset.area===a));reset()}function setLevel(n){level=n;document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('sel',+b.dataset.level===n));reset()}function render(){stop();updateTabs();$('nextLevel').hidden=true;locked=false;flipped=[];matched=new Set();spell=0;let item=sets[area][index];$('score').textContent=`${area==='park'?'🌳 公園':'🏠 住宅'}｜第 ${level+1} 關｜${level===1?'6 組配對':(index+1)+'/6 題'}｜得分 ${points}`;$('status').textContent='';$('next').hidden=true;if(level===0)mole(item);if(level===1)memory();if(level===2)shoot(item)}function mole(item){$('prompt').textContent='🐹 聽日文，敲出正確圖案';$('hint').textContent='答對後可前往下一題';$('arena').innerHTML='<div id="holes"></div>';shuffle([...sets[area]]).forEach(([w,e])=>{let b=document.createElement('button');b.className='mole';b.innerHTML=e+'<small>敲我！</small>';b.onclick=()=>{if(locked)return;if(w===item[0]){points+=10;locked=true;sound(true);message('✨ 答對了！'+w);$('next').hidden=false}else{sound(false);message('再試一次！')}};$('holes').append(b)});say(item[0])}function memory(){$('prompt').textContent='🃏 翻開圖卡與日文字卡，找出六組';$('hint').textContent='翻到文字卡會播放日文';let deck=shuffle(sets[area].flatMap(([w,e])=>[{w,face:w,type:'word'},{w,face:e,type:'picture'}]));$('arena').innerHTML='<div class="cards" id="deck"></div>';const sid=session;deck.forEach((card,i)=>{let b=document.createElement('button');b.className='card';b.textContent='？';b.onclick=()=>{if(locked||matched.has(i)||flipped.includes(i)||flipped.length>=2)return;b.classList.add('open');b.textContent=card.face;flipped.push(i);if(card.type==='word')say(card.w);if(flipped.length===2){let[x,y]=flipped;if(deck[x].w===deck[y].w&&deck[x].type!==deck[y].type){matched.add(x);matched.add(y);points+=10;sound(true);[x,y].forEach(j=>$('deck').children[j].classList.add('done'));flipped=[];message('已配對 '+matched.size/2+'/6');if(matched.size===12){message('🎉 全部配對成功！');complete();$('next').hidden=true}}else{locked=true;sound(false);setTimeout(()=>{if(sid!==session)return;[x,y].forEach(j=>{let el=$('deck').children[j];el.textContent='？';el.classList.remove('open')});flipped=[];locked=false},850)}}};$('deck').append(b)})}function shoot(item){$('prompt').textContent='🎯 依序擊落平假名，拼出單字';$('hint').textContent='等正確假名經過中央準星，再按發射';$('arena').innerHTML='<div class="slots" id="slots"></div><div class="flight"><div class="cross"></div><div id="fliers"></div></div><button class="primary" id="fire">🎯 發射！</button>';let chars=[...item[0]];$('slots').textContent=chars.map(()=>'□').join(' ');let pool=[...new Set([...chars,...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもらりるれろ'])];flightItems=Array.from({length:7},(_,i)=>({letter:i%3===0?chars[i%chars.length]:pool[rand(pool.length)],x:-70-i*120}));flightItems[0].letter=chars[0];flightItems.forEach(o=>{o.el=document.createElement('span');o.el.className='target';o.el.textContent='🪽'+o.letter;$('fliers').append(o.el)});last=0;let sid=session;function tick(t){if(sid!==session)return;let dt=Math.min(t-last||16,40);last=t;let width=document.querySelector('.flight').clientWidth;flightItems.forEach(o=>{o.x+=dt*.085;if(o.x>width+90){o.x=-100;o.letter=Math.random()<.5?chars[Math.min(spell,chars.length-1)]:pool[rand(pool.length)];o.el.textContent='🪽'+o.letter}o.el.style.left=o.x+'px'});anim=requestAnimationFrame(tick)}anim=requestAnimationFrame(tick);$('fire').onclick=()=>{if(locked)return;let width=document.querySelector('.flight').clientWidth;let near=flightItems.filter(o=>Math.abs(o.x-width/2)<45).sort((a,b)=>Math.abs(a.x-width/2)-Math.abs(b.x-width/2))[0];if(!near){message('等待字卡經過準星！');sound(false);return}if(near.letter===chars[spell]){points+=10;spell++;sound(true);$('slots').textContent=chars.map((c,i)=>i<spell?c:'□').join(' ');near.x=-100;near.letter=pool[rand(pool.length)];near.el.textContent='🪽'+near.letter;message('✨ 命中！');if(spell===chars.length){locked=true;stop();say(item[0]);message('🎉 拼字成功：'+item[0]);$('next').hidden=false}}else{sound(false);message('射錯了，再聽一次！')}};say(item[0])}$('nextLevel').onclick=()=>setLevel(Math.min(2,level+1));$('gotIt').onclick=()=>{$('onboard').hidden=true;try{localStorage.setItem('townGamesOnboard','1')}catch(e){}};try{if(!localStorage.getItem('townGamesOnboard'))$('onboard').hidden=false}catch(e){}document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>setArea(b.dataset.area));document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>setLevel(+b.dataset.level));$('listen').onclick=()=>say(sets[area][index][0]);$('restart').onclick=reset;$('next').onclick=next;setArea(area);
</script></html>
