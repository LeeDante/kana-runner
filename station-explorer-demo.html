<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🚉 車站探索｜第一關測試</title><style>
*{box-sizing:border-box}body{margin:0;background:#d9edf0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#34516b}.app{max-width:520px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 11px max(14px,env(safe-area-inset-bottom));gap:9px;background:linear-gradient(#d4e9ff,#f7ecdd)}header{display:flex;align-items:center;justify-content:space-between;gap:8px}.back{color:#49708d;text-decoration:none;background:#fffdf5;padding:10px 12px;border-radius:14px;font-weight:800}h1{font-size:21px;margin:0}.sub{font-size:11px;color:#6788a0}.status{background:#fffaf1;border-radius:14px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}.rail{height:7px;background:#e5dcd1;border-radius:12px;overflow:hidden;margin-top:5px}.rail i{display:block;height:100%;background:#67b59d;width:0;transition:width .2s}.stage{position:relative;flex:1;min-height:365px;overflow:hidden;border:4px solid white;border-radius:21px;background:linear-gradient(#89c8ee 0%,#d4eef6 32%,#a0c8a1 33%,#6fb693 100%);box-shadow:0 5px 16px #385f6b4d}.mountain{position:absolute;top:2%;left:23%;width:55%;height:27%;background:linear-gradient(145deg,#fff 0 22%,#83a7b0 23%);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.65}.track{position:absolute;top:44%;left:-15%;width:130%;height:15%;transform:rotate(-8deg);border-top:8px solid #6f756e;border-bottom:8px solid #6f756e;background:repeating-linear-gradient(90deg,#a5967e 0 16px,#d1c2a7 16px 36px)}.station{position:absolute;top:25%;left:11%;width:78%;height:25%;background:#f6e7cd;border:5px solid #786c6a;border-radius:6px;box-shadow:inset 0 22px #e2b894}.station:before{content:"";position:absolute;left:-7%;right:-7%;top:-22%;height:33%;background:#566a7b;clip-path:polygon(10% 100%,26% 0,75% 0,92% 100%)}.stationName{position:absolute;top:6%;left:35%;width:30%;border-radius:5px;background:#fffaf1;text-align:center;font-weight:900;font-size:15px}.stationDoors{position:absolute;inset:42% 29% 0;border:5px solid #7e8c8a;background:#8ec5dd}.street{position:absolute;left:-20%;bottom:-15%;width:140%;height:45%;background:#d7c39e;border-radius:50% 50% 0 0;box-shadow:0 -7px #9fbc99}.sakura{position:absolute;font-size:45px;pointer-events:none;filter:drop-shadow(0 4px 2px #50887955)}.tree1{top:15%;left:0}.tree2{top:21%;right:-6%}.tree3{bottom:8%;left:0}.sceneLabel{position:absolute;top:12px;left:12px;background:#fffcf2ec;padding:7px 12px;border-radius:100px;font-size:12px;font-weight:900;z-index:2}.item{position:absolute;display:flex;align-items:center;justify-content:center;gap:2px;flex-direction:column;width:26%;height:15%;min-height:52px;border:2px solid #fff;border-radius:15px;background:#ffffffe1;box-shadow:0 4px 0 #617c795c,0 6px 10px #344e5633;cursor:pointer;transform:translate(-50%,-50%);color:#38536b;z-index:3;transition:filter .15s,transform .15s}.item:active{transform:translate(-50%,-50%) scale(.94)}.item .ico{font-size:clamp(25px,6dvh,42px)}.item .caption{font-size:11px;font-weight:900}.item.correct{background:#ddf6e8;border-color:#51b681}.item.wrong{background:#ffe1dc;border-color:#ed7b78}.item[data-id="0"]{left:24%;top:50%}.item[data-id="1"]{left:78%;top:56%}.item[data-id="2"]{left:26%;top:73%}.item[data-id="3"]{left:74%;top:33%}.item[data-id="4"]{left:76%;top:76%}.item[data-id="5"]{left:27%;top:32%}
.bottom{background:#fffaf2;border:2px solid white;border-radius:18px;padding:13px;box-shadow:0 4px 12px #3b76832c}.question{font-weight:900;text-align:center;font-size:16px;line-height:1.5}.hint{text-align:center;font-size:12px;color:#718191;margin-top:5px}.actions{display:flex;gap:7px;margin-top:11px}button{font:inherit;touch-action:manipulation}.actions button{border:0;border-radius:11px;background:#5b9cb4;color:white;padding:11px;font-weight:900;flex:1}.actions button:disabled{background:#c1ccce}.actions .light{background:#e8f3f2;color:#3b7580}.feedback{min-height:23px;text-align:center;font-weight:900;font-size:13px;margin-top:6px;color:#438871}.done{background:#e6f7e7;padding:12px;border-radius:14px;text-align:center;font-weight:900}small.note{display:block;text-align:center;color:#6b8591;font-size:11px}
/* GitHub-hosted image asset upload test */
.stage{background:#c9e5ec url('./%E6%98%A5%E6%97%A5%E6%AB%BB%E8%8A%B1%E9%90%B5%E9%81%93%E5%B0%8F%E9%8E%AE%E7%AB%99%E5%BB%A3%E5%A0%B4_%E7%B6%B2%E7%AB%99%E7%89%88.webp?v=4') center center/cover no-repeat}
.stage .mountain,.stage .station,.stage .track,.stage .street,.stage .sakura{display:none}
.stage .item{background:#fffcf1e3;backdrop-filter:blur(3px)}
.stage{background-position:center center;background-size:cover}

/* V5 · smartphone-first full-scene layout */
html,body{height:100%;overflow:hidden}
.app{height:100dvh;min-height:0;gap:5px;padding:max(6px,env(safe-area-inset-top)) 8px max(7px,env(safe-area-inset-bottom))}
header{min-height:39px;flex:none}
.back{padding:7px 10px;border-radius:10px;font-size:12px}
h1{font-size:17px;line-height:1.15}
.sub{font-size:9px;line-height:1.3}
.status{flex:none;padding:5px 10px;border-radius:9px;font-size:11px}
.rail{height:4px;margin-top:0;flex:none}
.stage{flex:1 1 auto;min-height:0;border-width:2px;border-radius:15px;box-shadow:0 3px 10px #385f6b39;background-position:center center;background-size:cover}
.sceneLabel{top:7px;left:7px;padding:4px 8px;font-size:10px;opacity:.93}
.item{width:22%;height:12%;min-height:44px;max-height:79px;border-radius:13px;border-width:1.5px;gap:0;background:#fffdf2d9;box-shadow:0 3px 0 #617c7955,0 4px 8px #344e5640;overflow:hidden}
.item .ico{font-size:clamp(25px,4.2dvh,37px);line-height:1.15}
.item .caption{display:none;font-size:10px;line-height:1.25}
.item.correct .caption{display:block}
.item[data-id="3"]{left:25%;top:20%}
.item[data-id="0"]{left:75%;top:20%}
.item[data-id="1"]{left:25%;top:49%}
.item[data-id="4"]{left:75%;top:49%}
.item[data-id="5"]{left:25%;top:78%}
.item[data-id="2"]{left:75%;top:78%}
.bottom{flex:none;border-radius:13px;padding:8px 9px;box-shadow:0 2px 8px #3b768324}
.question{font-size:13px;line-height:1.35;min-height:18px}
.hint{font-size:10px;margin-top:3px;line-height:1.25;min-height:13px}
.feedback{min-height:0;margin-top:3px;font-size:11px;line-height:1.25}
.feedback:empty{display:none}
.actions{gap:7px;margin-top:7px}
.actions button{padding:9px 6px;font-size:12px;border-radius:9px;min-height:39px}
small.note{flex:none;font-size:9px;line-height:1.15}
@media(max-height:640px){.app{gap:3px}.sub{display:none}.status{padding:4px 9px}.bottom{padding:6px 8px}.actions{margin-top:5px}.actions button{min-height:35px;padding:7px 5px}small.note{display:none}}

/* V6 sound feedback */
header .sound-toggle{border:1px solid #ffffffc9;background:#fffdf4d9;border-radius:10px;padding:6px 9px;font-size:17px;cursor:pointer;flex:none}
.item.correct{animation:answerPop .35s ease-out}
.item.wrong{animation:answerShake .25s ease-in-out}
@keyframes answerPop{0%{transform:translate(-50%,-50%) scale(.88)}65%{transform:translate(-50%,-50%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes answerShake{0%,100%{transform:translate(-50%,-50%)}30%{transform:translate(calc(-50% - 5px),-50%)}70%{transform:translate(calc(-50% + 5px),-50%)}}
.groupPick{display:flex;gap:5px;overflow-x:auto}.groupPick button{flex:none;border:1px solid #b7d6db;background:#fffaf0;border-radius:9px;padding:6px 8px;color:#4f7487;font-size:11px;font-weight:900}.groupPick button.active{background:#357e9c;color:white}@media(max-height:660px){.groupPick button{font-size:10px;padding:5px 6px}}</style></head><body><main class="app"><header><a class="back" href="./index.html?open=town&return=station&v=20">‹ 小鎮</a><div><div class="sub">STATION EXPLORER · 互動範例</div><h1>🚉 車站探索</h1></div><button class="sound-toggle" id="soundToggle" type="button" aria-label="關閉答題音效" aria-pressed="true">🔔</button></header><div class="groupPick" id="groups"></div><div class="status"><span id="step">第 1 / 6 題</span><span id="score">正確 0 題</span></div><div class="rail"><i id="bar"></i></div><section class="stage" aria-label="日本車站互動地圖"><div class="mountain"></div><div class="station"><div class="stationName">えき</div><div class="stationDoors"></div></div><div class="track"></div><div class="street"></div><div class="sakura tree1">🌸</div><div class="sakura tree2">🌸</div><div class="sakura tree3">🌸</div><span class="sceneLabel">🌸 車站前廣場</span><div id="items"></div></section><div class="bottom"><div class="question" id="question">🔊 聽發音，點選正確交通工具</div><div class="hint" id="hint">點選場景中的交通工具｜可重聽、無限時</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="light" id="speak">🔊 點擊播放日文</button><button id="next" disabled>下一題 ›</button></div></div><small class="note">🧪 試玩版｜不影響正式學習紀錄</small></main><script>
const vocabGroups=[[["でんしゃ","densha","電車","🚃"],["バス","basu","公車","🚌"],["タクシー","takushii","計程車","🚕"],["しんかんせん","shinkansen","新幹線","🚄"],["ちかてつ","chikatetsu","地下鐵","🚇"],["じてんしゃ","jitensha","腳踏車","🚲"]],[["えき","eki","車站","🚉"],["ホーム","hōmu","月台","🚏"],["かいさつ","kaisatsu","驗票口","🎟️"],["いりぐち","iriguchi","入口","🚪"],["でぐち","deguchi","出口","🚶"],["トイレ","toire","廁所","🚻"]],[["みぎ","migi","右邊","➡️"],["ひだり","hidari","左邊","⬅️"],["まっすぐ","massugu","直走","⬆️"],["ちかい","chikai","近","📍"],["とおい","tōi","遠","🗺️"],["あるく","aruku","走路","🚶"]],[["きっぷ","kippu","車票","🎫"],["のる","noru","搭乘","🚃"],["おりる","oriru","下車","🚶"],["のりかえ","norikae","轉乘","🔁"],["じこくひょう","jikokuhyō","時刻表","🕒"],["うんちん","unchin","車資","💴"]]];
let groupNo=Math.max(0,Math.min(3,Number(new URLSearchParams(location.search).get('group'))||0));
let words=vocabGroups[groupNo];
const $=id=>document.getElementById(id),order=[3,1,5,0,4,2];let idx=0,correct=0,answered=false,utterance=null;

let effectContext=null,effectsEnabled=true;
function playEffect(type){
  if(!effectsEnabled)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!effectContext)effectContext=new AC();
    const ctx=effectContext;
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    const start=ctx.currentTime+.012;
    const notes=type==='correct' ? [[659.25,0,.12],[783.99,.115,.12],[1046.50,.23,.22]] : [[330,0,.14],[246.94,.15,.21]];
    notes.forEach(([hz,offset,duration])=>{
      const oscillator=ctx.createOscillator(),gain=ctx.createGain(),t=start+offset;
      oscillator.type=type==='correct'?'sine':'triangle';
      oscillator.frequency.setValueAtTime(hz,t);
      gain.gain.setValueAtTime(.0001,t);
      gain.gain.exponentialRampToValueAtTime(type==='correct'?.045:.037,t+.014);
      gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
      oscillator.connect(gain);gain.connect(ctx.destination);oscillator.start(t);oscillator.stop(t+duration+.015);
    });
  }catch(e){/* audio unavailable; visual feedback remains */}
}
$('soundToggle').onclick=()=>{
  effectsEnabled=!effectsEnabled;
  $('soundToggle').textContent=effectsEnabled?'🔔':'🔕';
  $('soundToggle').setAttribute('aria-label',effectsEnabled?'關閉答題音效':'開啟答題音效');
  $('soundToggle').setAttribute('aria-pressed',String(effectsEnabled));
  if(effectsEnabled)playEffect('correct');
};
function showAudioFallback(message){$('hint').textContent=message;$('question').textContent='請找出：'+words[order[idx]][0]+'（'+words[order[idx]][1]+'）'}
function say(){const word=words[order[idx]];if(!('speechSynthesis' in window)){showAudioFallback('此瀏覽器不支援語音，已顯示日文提示。');return}
try{const synth=window.speechSynthesis;synth.cancel();const u=new SpeechSynthesisUtterance(word[0]);u.lang='ja-JP';u.rate=.82;u.pitch=1;u.volume=.78;const voices=synth.getVoices();const ja=voices.find(v=>v.lang.toLowerCase()==='ja-jp')||voices.find(v=>v.lang.toLowerCase().startsWith('ja'));if(ja)u.voice=ja;utterance=u;let fired=false;u.onstart=()=>{fired=true;$('hint').textContent='🔊 正在播放：'+word[0]+'。可以再次點擊重聽。'};u.onend=()=>{$('speak').textContent='🔊 再聽一次'};u.onerror=()=>{if(utterance===u)showAudioFallback('語音播放失敗，請確認裝置音量，或改用下方日文提示。')};$('speak').textContent='🔊 播放日文';synth.speak(u);setTimeout(()=>{if(utterance===u&&!fired&&!synth.speaking&&!synth.pending)showAudioFallback('未偵測到語音播放，請再次點擊播放，或查看日文提示。')},1300)}catch(e){showAudioFallback('裝置暫時無法播放語音，已顯示日文。')}}
function draw(){const gb=$('groups');gb.replaceChildren();['交通工具','車站地點','方向與移動','乘車與票券'].forEach((n,i)=>{const b=document.createElement('button');b.textContent='ABCD'[i]+' '+n;b.className=i===groupNo?'active':'';b.onclick=()=>{groupNo=i;words=vocabGroups[i];idx=0;correct=0;history.replaceState(null,'','?group='+i+'&v=8');draw()};gb.append(b)});answered=false;$('step').textContent='第 '+(idx+1)+' / 6 題';$('score').textContent='正確 '+correct+' 題';$('bar').style.width=(idx/6*100)+'%';$('question').textContent='聽日文，找出正確目標';$('hint').textContent='依照聲音，在場景中找出目標；可重聽、無時間限制。';$('feedback').textContent='';$('next').disabled=true;$('speak').textContent='🔊 點擊播放日文';const area=$('items');area.replaceChildren();words.forEach((w,i)=>{let b=document.createElement('button');b.className='item';b.dataset.id=i;b.setAttribute('aria-label','目標 '+(i+1));b.innerHTML='<span class="ico">'+w[3]+'</span><span class="caption">點擊查看</span>';b.onclick=()=>pick(i,b);area.append(b)})}
function recordStationResult(stage,jp,ok){
 try{const key='station-'+groupNo+'-'+jp;const all=JSON.parse(localStorage.getItem('kanaRunnerTownWordV1')||'{}');const rec=all[key]||{ok:[0,0,0],wrong:[0,0,0],hint:0};rec.ok=Array.isArray(rec.ok)?rec.ok:[0,0,0];rec.wrong=Array.isArray(rec.wrong)?rec.wrong:[0,0,0];const ar=ok?rec.ok:rec.wrong;ar[stage]=(ar[stage]||0)+1;rec.last=Date.now();all[key]=rec;localStorage.setItem('kanaRunnerTownWordV1',JSON.stringify(all))}catch(e){}
}
function pick(i,b){if(answered)return;recordStationResult(0,words[order[idx]][0],i===order[idx]);const target=order[idx],w=words[target];if(i!==target){playEffect('wrong');b.classList.add('wrong');$('feedback').textContent='再試一次，可點擊重聽。';setTimeout(()=>b.classList.remove('wrong'),600);return}answered=true;correct++;playEffect('correct');b.classList.add('correct');b.querySelector('.caption').textContent=w[0];$('question').textContent='✅ '+w[0]+' · '+w[2];$('feedback').textContent='答對！';$('score').textContent='正確 '+correct+' 題';$('next').disabled=false;$('next').textContent=idx===5?'查看成果 ✓':'下一題 ›'}
$('speak').onclick=say;$('next').onclick=()=>{if(!answered)return;if(idx===5){$('bar').style.width='100%';$('question').innerHTML='<div class="done">🎉 第一關完成！六個單字都找到了。</div>';$('hint').textContent='第一關完成！可以前往第二關搭車任務。';$('feedback').textContent='';$('next').textContent='前往第二關 →';$('next').disabled=false;$('next').onclick=()=>location.href='./station-journey-demo.html?group='+groupNo+'&v=4';return}idx++;draw();$('hint').textContent='請點擊「播放日文」聽下一題。'};draw();
</script></body></html>
