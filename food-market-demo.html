<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffeddc"><title>美食街雙視角試玩｜五十音之路</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#fae9df;color:#34556c;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}body{display:grid;place-items:center;padding:12px}button{font:inherit;touch-action:manipulation;cursor:pointer}#app{width:min(480px,100%);border:3px solid #fff;border-radius:24px;background:#fffaf1;box-shadow:0 12px 36px #7e807544;overflow:hidden}header{padding:12px 15px;background:linear-gradient(110deg,#ffe3e8,#dff4fa);display:flex;justify-content:space-between;align-items:center;gap:8px}header strong{display:block;font-size:18px}header small{font-size:10px;color:#a76b80;letter-spacing:1px;font-weight:900}header a{background:white;color:#896579;border-radius:12px;padding:9px;text-decoration:none;font-size:12px;font-weight:800}nav{display:flex;gap:6px;padding:9px;background:#fffbf4}nav button{border:1px solid #e9ced0;background:white;color:#9c7080;border-radius:12px;flex:1;padding:10px 3px;font-size:12px;font-weight:900}nav button.active{background:#f291ac;color:white;border-color:#f291ac}.task{display:flex;justify-content:space-between;align-items:center;gap:5px;margin:0 9px 8px;padding:9px 11px;border-radius:13px;background:#f2f7ee;font-weight:900;font-size:12px}.task #score{color:#43806e}.arena{margin:0 9px;position:relative;height:min(56dvh,430px);min-height:250px;border:3px solid #fff;overflow:hidden;border-radius:18px;background:#a8e4f8}canvas{width:100%;height:100%;display:block}.banner{position:absolute;top:9px;left:50%;transform:translateX(-50%);min-width:65%;text-align:center;background:#fffcf3ed;border:2px solid white;border-radius:14px;padding:7px 12px;box-shadow:0 5px 12px #775a5340;pointer-events:none}.banner b{display:block;font-size:23px;color:#405c78}.banner small{font-size:11px;color:#9c6777}.feedback{min-height:23px;font-weight:850;font-size:12px;text-align:center;color:#477964;padding:5px 10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:4px 13px}.controls button{min-height:60px;border:3px solid #fff;border-radius:16px;background:#bfeafa;box-shadow:0 4px #8abbce;color:#315875;font-weight:950;font-size:23px}.controls button:nth-child(2){background:#ffd3e2;box-shadow:0 4px #d9a8b8}.controls button:disabled{opacity:.46}.subcontrols{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px}.subcontrols button{border:1px solid #e5d0c5;border-radius:10px;background:white;color:#775d70;padding:8px 11px;font-size:12px;font-weight:800}#marketHint{font-size:11px;text-align:center;color:#897569;margin:4px 9px}.done{display:none;position:absolute;inset:0;background:#fff7e9ed;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:22px}.done.show{display:flex}.done .cup{font-size:67px}.done strong{font-size:24px}.done p{font-size:13px;line-height:1.65}.done button{background:#ee88a3;border:0;border-radius:13px;padding:14px 30px;color:white;font-weight:900}
@media(max-height:690px){body{padding:3px}.arena{height:47vh;min-height:260px}.controls button{min-height:49px}.subcontrols{padding:7px}}
</style></head><body><main id="app"><header><div><small>PLAYABLE CONCEPT · V3.4 PREVIEW</small><strong>🍜 美食街雙視角試玩</strong></div><a href="./">↩ 正式版</a></header><nav><button id="runTab" class="active">🏃 ① 透視跑酷</button><button id="shopTab">🛒 ② 俯視採購</button></nav><div class="task"><span id="stage">第 1 關｜看圖找單字</span><span id="score">0 / 6</span></div><div class="arena"><canvas id="view" width="440" height="460" aria-label="動態美食街遊戲場景"></canvas><div class="banner"><small id="promptLabel">看到圖片，跑向正確答案門</small><b id="prompt">🍎</b></div><div class="done" id="done"><div class="cup">🏆🧺</div><strong id="doneTitle">挑戰完成</strong><p id="doneText"></p><button id="doneNext">再玩一次</button></div></div><div class="feedback" id="feedback" aria-live="polite">點選下方左右方向鍵，角色會移動並穿過答案門。</div><div class="controls"><button id="left">⬅ 左</button><button id="right">右 ➡</button></div><div class="subcontrols"><button id="speak">🔊 聽日文</button><button id="reset">↻ 重新開始</button><button id="pause">⏸ 暫停</button></div><p id="marketHint">兩種玩法共用六個詞：みず、すし、りんご、ごはん、パン、おちゃ。手機可直接點擊按鈕操作。</p></main><script>
(()=>{
const root=document.getElementById('app'),$=id=>root.querySelector('#'+id);
const words=[['みず','水','💧'],['すし','壽司','🍣'],['りんご','蘋果','🍎'],['ごはん','飯','🍚'],['パン','麵包','🍞'],['おちゃ','茶','🍵']];
let mode='run',index=0,score=0,chosen=-1,phase='ready',progress=0,runner=0,stamp=0,offset=0,particles=[],paused=false,raf=0,question=[],resultTimer=0;
const c=$('view'),ctx=c.getContext('2d');ctx.textAlign='center';
function roundrect(x,y,w,h,r,fill,stroke){ctx.beginPath();if(typeof ctx.roundRect==='function'){ctx.roundRect(x,y,w,h,r)}else{const rr=Math.min(r,w/2,h/2);ctx.moveTo(x+rr,y);ctx.lineTo(x+w-rr,y);ctx.quadraticCurveTo(x+w,y,x+w,y+rr);ctx.lineTo(x+w,y+h-rr);ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);ctx.lineTo(x+rr,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-rr);ctx.lineTo(x,y+rr);ctx.quadraticCurveTo(x,y,x+rr,y)}if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
function txt(t,x,y,size=20,color='#344e67',weight=900){ctx.fillStyle=color;ctx.textAlign='center';ctx.font=weight+' '+size+'px system-ui,"Noto Sans TC"';ctx.fillText(t,x,y)}
function say(){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(words[index][0]);u.lang='ja-JP';u.rate=.76;speechSynthesis.speak(u)}catch{}}
function buildQuestion(){const w=words[index],wrong=words[(index+2)%6];question=index%2?[wrong,w]:[w,wrong];chosen=-1;runner=0;progress=0;phase='ready';particles=[];$('feedback').textContent=mode==='run'?'🏃 選左或右，穿過日文答案門':'🛒 聽日文後，選出正確攤販';$('promptLabel').textContent=mode==='run'?'看圖片，跑向正確答案門':'聽日文，找到對應的商品';$('prompt').textContent=mode==='run'?w[2]:'🔊 '+w[0];$('score').textContent=score+' / 6';$('stage').textContent=mode==='run'?'第 1 關｜看圖找單字':'第 2 關｜聽音逛攤販';if(mode==='shop')setTimeout(()=>{if(mode==='shop'&&phase==='ready'&&!paused)say()},350)}
function play(which){if(paused||phase!=='ready')return;chosen=which;phase='moving';progress=0;$('feedback').textContent=mode==='run'?'🏃 正在跑向 '+question[chosen][0]+' …':'🛒 走向 '+question[chosen][1]+' 攤位 …'}
function resolve(){const ok=question[chosen][0]===words[index][0];if(ok)score++;phase='feedback';$('feedback').textContent=ok?'✨ 採購成功！ '+words[index][0]+'＝'+words[index][1]:'💡 還沒買對：'+words[index][0]+'＝'+words[index][1];particles=Array.from({length:22},(_,i)=>({x:220+(Math.random()-.5)*170,y:240+(Math.random()-.5)*70,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,life:50,kind:i%2?'🌸':'⭐'}));const savedMode=mode;resultTimer=setTimeout(()=>{if(mode!==savedMode||paused)return;index++;if(index>=6)finish();else buildQuestion()},1400)}
function finish(){phase='done';$('done').classList.add('show');$('doneTitle').textContent=score>=4?'🎉 採購成功！':'🌱 再試一次';$('doneText').textContent='你答對了 '+score+' / 6 題。這是雙視角操作示範，尚不是正式記憶測驗。';$('doneNext').textContent=mode==='run'?'前往俯視採購 ▶':'再玩俯視採購 ↻'}
function change(m){clearTimeout(resultTimer);mode=m;index=0;score=0;paused=false;$('pause').textContent='⏸ 暫停';$('done').classList.remove('show');$('runTab').classList.toggle('active',m==='run');$('shopTab').classList.toggle('active',m==='shop');buildQuestion()}
function drawRun(dt){const t=offset;const W=440,H=460;let sky=ctx.createLinearGradient(0,0,0,300);sky.addColorStop(0,'#8cdbff');sky.addColorStop(1,'#ffe7d5');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff5c9';ctx.beginPath();ctx.arc(355,80,40,0,Math.PI*2);ctx.fill();txt('🌸',55,105,45);txt('🌸',390,146,38);
ctx.fillStyle='#98bf9d';ctx.beginPath();ctx.moveTo(0,227);ctx.lineTo(95,120);ctx.lineTo(192,235);ctx.lineTo(310,135);ctx.lineTo(440,224);ctx.fill();
for(let side of [-1,1]){for(let i=0;i<4;i++){const y=100+i*83+((t*38)%83),scale=.35+i*.32;const x=220+side*(50+i*50);roundrect(x-26*scale,y-35*scale,55*scale,61*scale,3,'#fdf2df','#ab776c');roundrect(x-31*scale,y-51*scale,65*scale,20*scale,3,'#d65a66');txt(['🍡','🍜','🍣','🍵'][(i+(side===1?1:0))%4],x,y+3*scale,24*scale);txt('🏮',x+side*28*scale,y-31*scale,19*scale)}}
ctx.fillStyle='#dbbca1';ctx.beginPath();ctx.moveTo(173,160);ctx.lineTo(267,160);ctx.lineTo(505,460);ctx.lineTo(-65,460);ctx.fill();ctx.fillStyle='#f7dfb6';ctx.beginPath();ctx.moveTo(187,160);ctx.lineTo(253,160);ctx.lineTo(452,460);ctx.lineTo(-12,460);ctx.fill();
ctx.strokeStyle='#fffcf3';ctx.lineWidth=4;for(let i=0;i<7;i++){let z=(i/7+(t*.19)%1);let y=161+300*z*z;ctx.beginPath();ctx.moveTo(220,y);ctx.lineTo(220,y+2+14*z);ctx.stroke()}
const z=phase==='moving'?Math.min(1,progress):0;const gy=190+z*125,spread=62+z*103,w=57+z*30,h=80+z*36;question.forEach((q,i)=>{let gx=220+(i===0?-spread:spread),color=i===0?'#6ec7ee':'#f19cbd';ctx.fillStyle=i===0?'rgba(110,199,238,.34)':'rgba(241,156,189,.34)';ctx.fillRect(gx-w/2,gy-h/2,w,h);ctx.lineWidth=7;ctx.strokeStyle=color;ctx.strokeRect(gx-w/2,gy-h/2,w,h);roundrect(gx-w/2-7,gy-h/2-32,w+14,26,8,'#fffdf7');txt(q[0],gx,gy-h/2-13,Math.round(19+z*6));});
const px=220+(chosen===-1?runner:(chosen===0?-95:95)*Math.min(1,progress*1.8));txt('🏃',px,401,55);txt('🧺',px+35,414,34);drawParticles(dt)}
function drawShop(dt){ctx.fillStyle='#a8e3f3';ctx.fillRect(0,0,440,460);ctx.fillStyle='#91bb8c';ctx.fillRect(0,130,440,330);for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#efdeb9':'#e7d3ac';ctx.fillRect((i%5)*90,165+Math.floor(i/5)*155,86,150)}
txt('🌸',32,105,45);txt('🌸',414,117,40);txt('🏮　日本美食橫丁　🏮',220,115,24,'#754b57');
const stalls=[{x:46,y:150,label:question[0]?.[1],emoji:question[0]?.[2],t:'#bfe6f1'},{x:248,y:150,label:question[1]?.[1],emoji:question[1]?.[2],t:'#f9cbdb'}];
for(let i=0;i<2;i++){const a=stalls[i];roundrect(a.x,a.y,145,120,12,'#fff9ef','#bd8f78');roundrect(a.x-5,a.y,155,33,7,i===0?'#70c7d8':'#ed9bb3');txt('🏮',a.x+15,a.y+35,21);txt(a.emoji||'🍡',a.x+72,a.y+72,42);txt(a.label||'',a.x+72,a.y+103,19)}
ctx.fillStyle='#fce9b6';ctx.beginPath();ctx.ellipse(220,340,180,77,0,0,Math.PI*2);ctx.fill();txt('🏃',220+(chosen===-1?0:(chosen===0?-107:106)*Math.min(1,progress)),355-(chosen===-1?0:75*Math.min(1,progress)),53);txt('🧺',248,386,30);txt('👆 點攤位選購',220,437,15,'#645a62');drawParticles(dt)}
function drawParticles(dt){particles.forEach(p=>{txt(p.kind,p.x,p.y,16);p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.24*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}
function loop(time){const dt=Math.min(2,(time-stamp)/16.67||1);stamp=time;if(!paused){try{offset+=dt*.3;if(phase==='moving'){progress+=dt/(mode==='run'?42:30);if(progress>=1){progress=1;resolve()}}if(mode==='run')drawRun(dt);else drawShop(dt)}catch(err){paused=true;$('feedback').textContent='畫面繪製發生問題：'+err.message;console.error(err);$('pause').textContent='▶ 重試'}}raf=requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{if(mode!=='shop'||phase!=='ready'||paused)return;const rect=c.getBoundingClientRect();const x=(e.clientX-rect.left)*440/rect.width,y=(e.clientY-rect.top)*460/rect.height;if(y>150&&y<295)play(x<220?0:1)});$('left').addEventListener('click',()=>play(0));$('right').addEventListener('click',()=>play(1));$('runTab').addEventListener('click',()=>change('run'));$('shopTab').addEventListener('click',()=>change('shop'));$('speak').addEventListener('click',say);$('reset').addEventListener('click',()=>change(mode));$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'▶ 繼續':'⏸ 暫停';if(!paused&&phase==='feedback'){clearTimeout(resultTimer);resultTimer=setTimeout(()=>{index++;index>=6?finish():buildQuestion()},1000)}});$('doneNext').addEventListener('click',()=>change(mode==='run'?'shop':'shop'));document.addEventListener('keydown',e=>{if(e.target?.tagName==='BUTTON')return;if(e.key==='ArrowLeft')play(0);if(e.key==='ArrowRight')play(1)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused){paused=true;$('pause').textContent='▶ 繼續'}});buildQuestion();raf=requestAnimationFrame(loop);
})();
</script></body></html>
