  if(selected)u.voice=selected;
  let begun=false,finished=false;
  voiceNotice('🔊 語音請求已送出，等待播放…');
  u.onstart=()=>{if(token!==voiceToken)return;begun=true;voiceNotice('🔊 正在播放 '+words[order[idx]].jp)};
  u.onend=()=>{if(token!==voiceToken)return;finished=true;voiceNotice('✅ 語音播放完成')};
  u.onerror=e=>{if(token!==voiceToken)return;finished=true;voiceNotice('⚠️ 日文語音失敗：'+(e.error||'未知錯誤')+'。請告訴我這個代碼')};
  syn.speak(u);
  setTimeout(()=>{if(token===voiceToken&&!begun&&!finished)voiceNotice('⚠️ 語音未啟動：請再次點擊播放，並告訴我顯示的訊息')},2200);
 }catch(e){voiceNotice('⚠️ 語音例外：'+(e.message||e))}
}
function updateTabs(){for(let i=0;i<3;i++){const b=$('stage'+i);b.disabled=false;b.classList.toggle('on',i===stage)}}
function boot(n){clearTimeout(delay);stage=n;idx=0;success=0;mistakes=0;completed=false;paused=false;slow=false;$('end').classList.remove('on');$('speed').textContent=n===2?'🔄 重排':'🐢 慢速';$('act').textContent=n===2?'✅ 完成':'✋ 拿取';$('hint').textContent=n===2?'💡 提示':'🔊 重聽';$('pause').textContent='⏸';updateTabs();newQuestion()}
function makeQueue(){const target=order[idx],size=4+idx%2,pool=shuffle(all.map((_,i)=>i).filter(i=>i!==target)).slice(0,size-1),slot=Math.floor(Math.random()*size);pool.splice(slot,0,target);$('belt').replaceChildren();queue=pool.map((id,i)=>{const el=document.createElement('div');el.className='beltItem';if(stage===0)el.innerHTML='<span>'+all[id].e+'</span>';else el.innerHTML='<strong>'+all[id].jp+'</strong>';el.style.left=(-60+i*133)+'px';$('belt').append(el);return{id,x:-60+i*133,el}})}
function makeSpelling(){chosen=[];usedHint=false;const word=words[order[idx]].jp;const chars=[...word];const others=shuffle(['あ','こ','く','し','ん','み','ず','お','す','ご','り','は','ぱ','ち'].filter(x=>!chars.includes(x))).slice(0,2);tiles=shuffle([...chars,...others]).map((ch,i)=>({ch,i}));renderSpell()}
function renderSpell(){const slots=$('slots');slots.replaceChildren();const goal=[...words[order[idx]].jp];goal.forEach((_,i)=>{const b=document.createElement('button');b.className='slot';b.textContent=chosen[i]?.ch||'　';b.disabled=i>=chosen.length;b.onclick=()=>{chosen.splice(i,1);renderSpell()};slots.append(b)});const host=$('tiles');host.replaceChildren();tiles.forEach(t=>{const b=document.createElement('button');b.className='tile';b.textContent=t.ch;b.disabled=chosen.some(x=>x.i===t.i);b.onclick=()=>{if(locked||paused||chosen.length>=goal.length)return;chosen.push(t);renderSpell()};host.append(b)})}
function newQuestion(){clearTimeout(delay);locked=false;audioMode=stage===0&&idx%2===1;$('belt').style.display=stage===2?'none':'block';$('pickup').style.display=stage===2?'none':'block';$('spellBox').classList.toggle('on',stage===2);$('act').disabled=false;$('instruction').textContent=stage===0?(audioMode?'🔊 聽日文，找出物品':'📖 看日文，找出物品'):stage===1?'🧠 看中文，找出日文字卡':'✍️ 依中文意思拼寫假名';$('taskEmoji').textContent=stage===0?(audioMode?'🔊':'📖'):words[order[idx]].e;$('taskText').textContent=stage===0?(audioMode?'請聽發音':words[order[idx]].jp):words[order[idx]].zh;$('stageName').textContent=['第 1 關｜辨認與聽力','第 2 關｜中文回想日文','第 3 關｜假名拼字'][stage];$('counter').textContent=success+' / 6';$('dots').textContent=Array.from({length:6},(_,i)=>i<success?'●':'○').join(' ');$('basket').textContent='已獲得 '+success+' 件';$('feedback').textContent=stage===2?'點選下方假名，拼出正確日文':'等待正確餐盤到中央，再按拿取';if(stage===2)makeSpelling();else makeQueue();if(stage===0&&!audioMode)$('hint').textContent='🔊 聽發音';if(audioMode){$('feedback').textContent='🔊 聽力題：點下方「重聽」開始播放日文';$('hint').textContent='🔊 播放題目'}}
function feedback(ok){if(locked)return;locked=true;$('act').disabled=true;const w=words[order[idx]];noteWord(ok);if(ok){success++;$('counter').textContent=success+' / 6';$('dots').textContent=Array.from({length:6},(_,i)=>i<success?'●':'○').join(' ');$('basket').textContent='已獲得 '+success+' 件';$('feedback').textContent='✨ 正確！ '+w.jp+'＝'+w.zh;const fx=document.createElement('div');fx.className='fly';fx.textContent=w.e;$('world').append(fx);setTimeout(()=>fx.remove(),730)}else{mistakes++;$('feedback').textContent='💡 正確答案：'+w.jp+'（'+w.zh+'），再練一次';}
delay=setTimeout(()=>{if(ok){idx++;if(idx>=6){endStage();return}}newQuestion()},ok?850:1250)}
function take(){if(locked||paused||completed)return;if(stage===2){const got=chosen.map(x=>x.ch).join(''),expected=words[order[idx]].jp;if(chosen.length!==[...expected].length){$('feedback').textContent='請先填滿所有格子';return}feedback(got===expected);return}const center=$('belt').clientWidth/2;if(!queue.length)return;const nearest=queue.reduce((a,b)=>Math.abs(a.x-center)<Math.abs(b.x-center)?a:b);if(Math.abs(nearest.x-center)>65){$('feedback').textContent='⏳ 等餐盤靠近中央再拿取！';return}feedback(nearest.id===order[idx])}
function endStage(){completed=true;$('counter').textContent='6 / 6 ✅';$('dots').textContent='● ● ● ● ● ●';$('basket').textContent='已獲得 6 件';$('act').disabled=true;$('end').classList.add('on');$('endIcon').textContent=stage===2?'🎉🍱':'🏆🧺';$('endTitle').textContent=['輸送帶採購完成！','記憶採購完成！','料理台拼字完成！'][stage];$('endText').textContent='完成 6 個單字，失誤 '+mistakes+' 次。'+(stage===2?'三關全部完成：18 / 18 ✅！記得隔天再複習，才會記得更牢。':'接著進行下一種記憶挑戰。');unlock=Math.max(unlock,Math.min(3,stage+1));saveUnlock();updateTabs();$('continue').textContent=stage===2?'再挑戰第一關':'前往第 '+(stage+2)+' 關'}
function animate(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused&&!locked&&!completed&&stage!==2){const width=$('belt').clientWidth;queue.forEach(it=>{it.x-=(slow?56:83)*dt;if(it.x < -60)it.x+=queue.length*133;it.el.style.left=it.x+'px'})}raf=requestAnimationFrame(animate)}
$('act').onclick=take;$('hint').onclick=()=>{if(stage===2){usedHint=true;const word=[...words[order[idx]].jp];$('feedback').textContent='💡 提示：第一個假名是「'+word[0]+'」';return}say()};
$('speed').onclick=()=>{if(stage===2){chosen=[];renderSpell()}else{slow=!slow;$('speed').textContent=slow?'🐇 正常速':'🐢 慢速'}};
$('pause').onclick=()=>{if(completed)return;paused=!paused;$('pause').textContent=paused?'▶':'⏸';$('act').disabled=paused||locked;$('feedback').textContent=paused?'⏸ 遊戲暫停':(stage===2?'繼續拼字':'繼續採購')};$('continue').onclick=()=>boot(stage===2?0:stage+1);$('retry').onclick=()=>boot(stage);for(let i=0;i<3;i++)$('stage'+i).onclick=()=>{boot(i)};document.addEventListener('visibilitychange',()=>{if(document.hidden&&!completed){paused=true;$('pause').textContent='▶';$('act').disabled=true}});boot(0);raf=requestAnimationFrame(animate);
})();
</script></body></html>
