flex;align-items:center;justify-content:space-between;gap:8px}.route button .icon{font-size:26px}.route button .label{font-size:14px;flex:1;text-align:left}.route button:active{transform:translateY(2px)}.route button.wrong{background:#ffd7d0;border-color:#df7970;animation:shake .3s}.route button.correct{background:#ddf8e6;border-color:#66c28e}.sceneBadge{position:absolute;bottom:12px;left:12px;right:12px;color:white;font-size:12px;font-weight:800;text-shadow:0 1px 5px #234}.ticket{position:absolute;top:21%;left:9%;right:9%;padding:13px;border-radius:17px;background:#edf5ed;border:7px solid #4b6777;box-shadow:0 8px 0 #304556,0 14px 22px #273a3b55}.machineTitle{background:#3e748b;color:#fff;border-radius:8px;text-align:center;font-size:12px;padding:7px;font-weight:900;letter-spacing:.7px}.display{background:#233e47;margin:10px 0;border-radius:9px;color:#c6ffdb;min-height:74px;padding:11px;text-align:center}.display .jp{font-size:27px;font-weight:900;letter-spacing:3px;min-height:35px}.display .cn{font-size:11px;color:#e4f1ec}.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0}.tiles button{border:1px solid #b6cecd;background:#fff;border-radius:9px;min-width:50px;min-height:48px;padding:8px;font-weight:900;font-size:22px;color:#315f71;box-shadow:0 3px 0 #abbdbc}.tiles button:disabled{opacity:.24}.ticketActions{display:flex;gap:9px}.ticketActions button{flex:1;background:#dcece9;border:0;border-radius:9px;padding:9px;font-size:12px;font-weight:900;color:#346275}.bottom{background:#fffdf5;border-radius:16px;border:2px solid white;padding:11px}.question{text-align:center;font-size:16px;font-weight:900;line-height:1.45}.help{text-align:center;font-size:12px;color:#78919a;margin-top:4px}.feedback{text-align:center;margin-top:7px;font-size:13px;font-weight:900;min-height:20px}.feedback.good{color:#2d9b69}.feedback.bad{color:#cc625e}.buttons{display:flex;gap:8px;margin-top:8px}.buttons button{border:0;border-radius:10px;padding:12px 6px;font-weight:900;flex:1;background:#e3f1f1;color:#416b79}.buttons button.next{background:#4e99b7;color:white}.buttons button:disabled{background:#c5d2d3;color:#eff5f4}.done{margin:auto 10px;background:#fffcf3e9;padding:23px 16px;text-align:center;font-weight:900;border-radius:18px}.done p{font-size:13px;font-weight:500}.done button{border:0;background:#4c95ad;color:#fff;font-weight:900;border-radius:10px;padding:12px 18px}.mute{margin-left:auto;border:0;background:#fffded;border-radius:9px;padding:8px}.foot{text-align:center;font-size:10px;color:#728b95}@keyframes shake{30%{transform:translateX(-6px)}70%{transform:translateX(6px)}}@media(max-height:680px){main{gap:5px}.scene{min-height:245px}.route{top:16%;gap:7px}.route button{padding:8px}.ticket{top:12%;padding:8px}.display{margin:7px 0;min-height:60px}.tiles{margin:6px 0}.tiles button{min-height:40px}.bottom{padding:8px}.buttons{margin-top:4px}.buttons button{padding:9px}.foot{display:none}}.groupRow{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}.groupRow button{flex:none;border:1px solid #c1d6da;border-radius:10px;background:#fff9eb;color:#4f7689;padding:8px;font-size:11px;font-weight:900}.groupRow button.active{background:#3e869f;color:#fff}.route{top:15%;left:7%;right:7%;display:grid;grid-template-columns:1fr 1fr;gap:9px}.route button{display:flex;flex-direction:column;justify-content:center;min-height:72px;padding:8px 4px}.route button .icon{font-size:29px}.route button .label{font-size:12px;text-align:center}.route button.correct,.tiles button.correct{background:#d8f6df;border:2px solid #5ebc84}.scene{min-height:320px}.ticket{top:13%}@media(max-height:730px){.route{top:12%;gap:6px}.route button{min-height:57px;padding:5px 3px}.route button .icon{font-size:23px}.route button .label{font-size:11px}.scene{min-height:240px}}</style></head>
<body><main><header><a class="back" id="stage1" href="./index.html?open=town&return=station-journey&v=20">‹ 第一關</a><div><div class="sub">JAPAN RAIL ADVENTURE · STATION</div><h1>🚉 日本電車旅行</h1></div><button id="mute" class="mute" title="切換答題音效">🔔</button></header><div class="groupRow" id="groups"></div><nav class="tabs"><button class="tab active" id="tab2">第二關｜搭車任務</button><button class="tab" id="tab3">第三關｜售票機</button></nav><div class="status"><span id="progress">任務 1 / 6</span><span id="score">完成 0 題</span></div><div class="bar"><i id="bar"></i></div><section class="scene" id="scene"><div class="sceneTitle" id="sceneTitle">🚏 尋找搭車路線</div><div id="game"></div><div class="sceneBadge" id="sceneBadge">櫻花車站｜聽指示完成旅行</div></section><section class="bottom"><div class="question" id="question"></div><div class="help" id="help"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="buttons"><button id="speak">🔊 播放日文</button><button class="next" id="next" disabled>下一題 ›</button></div></section><div class="foot">🧪 第二、三關試玩版｜不影響正式熟悉度</div></main>
<script>
const $=id=>document.getElementById(id),groups=[["交通工具","🚉 站前廣場",[["でんしゃ","電車","🚃","搭乘普通電車"],["バス","公車","🚌","去公車站搭車"],["タクシー","計程車","🚕","搭乘計程車"],["しんかんせん","新幹線","🚄","搭乘高速列車"],["ちかてつ","地下鐵","🚇","搭乘地下鐵"],["じてんしゃ","腳踏車","🚲","騎腳踏車出發"]]],["車站地點","🚪 車站大廳",[["えき","車站","🚉","找到車站"],["ホーム","月台","🚏","到月台等車"],["かいさつ","驗票口","🎟️","經過驗票口"],["いりぐち","入口","🚪","從入口進站"],["でぐち","出口","🚶","從出口離開"],["トイレ","廁所","🚻","尋找站內廁所"]]],["方向與移動","🧭 車站通道",[["みぎ","右邊","➡️","往右轉"],["ひだり","左邊","⬅️","往左轉"],["まっすぐ","直走","⬆️","直直向前走"],["ちかい","近","📍","選擇近處"],["とおい","遠","🗺️","選擇遠處"],["あるく","走路","🚶","步行前往"]]],["乘車與票券","🎫 售票與月台",[["きっぷ","車票","🎫","購買車票"],["のる","搭乘","🚃","走進車廂"],["おりる","下車","🚶","走出車廂"],["のりかえ","轉乘","🔁","轉搭另一條線"],["じこくひょう","時刻表","🕒","查詢出發時間"],["うんちん","車資","💴","查看搭車費用"]]]];
let groupNo=Math.max(0,Math.min(3,Number(new URLSearchParams(location.search).get('group'))||0)),phase=2,idx=0,score=0,done=false,picked=[],ctx=null,soundOn=true,voice=null;
const items=()=>groups[groupNo][2], word=()=>items()[idx];
function audio(ok){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!ctx)ctx=new A();if(ctx.state==='suspended')ctx.resume();const notes=ok?[[659,0],[784,.1],[1047,.2]]:[[330,0],[247,.13]];notes.forEach(([f,d])=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+d;o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.04,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.17)})}catch(e){}}
$('mute').onclick=()=>{soundOn=!soundOn;$('mute').textContent=soundOn?'🔔':'🔕'};
function say(){try{if(!window.speechSynthesis)throw Error();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word()[0]);u.lang='ja-JP';u.rate=.83;u.volume=.78;const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;voice=u;u.onerror=()=>{$('help').textContent='語音無法播放：'+word()[0]};speechSynthesis.speak(u)}catch(e){$('help').textContent='無法播放語音：'+word()[0]}}
$('speak').onclick=say;
function recordStationResult(stage,jp,ok){
 try{const key='station-'+groupNo+'-'+jp;const all=JSON.parse(localStorage.getItem('kanaRunnerTownWordV1')||'{}');const rec=all[key]||{ok:[0,0,0],wrong:[0,0,0],hint:0};rec.ok=Array.isArray(rec.ok)?rec.ok:[0,0,0];rec.wrong=Array.isArray(rec.wrong)?rec.wrong:[0,0,0];const ar=ok?rec.ok:rec.wrong;ar[stage]=(ar[stage]||0)+1;rec.last=Date.now();all[key]=rec;localStorage.setItem('kanaRunnerTownWordV1',JSON.stringify(all))}catch(e){}
}
function mark(ok,b){recordStationResult(phase-1,word()[0],ok);audio(ok);$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?'✅ 答對！':'❌ 再試一次！';if(b){b.classList.add(ok?'correct':'wrong');if(!ok)setTimeout(()=>b.classList.remove('wrong'),430)}if(ok){done=true;score++;$('score').textContent='完成 '+score+' 題';$('question').textContent='✅ '+word()[0]+' · '+word()[1];$('next').disabled=false;$('next').textContent=idx===5?(phase===2?'前往第三關 →':'完成本組 ✓'):'下一題 ›'}}
function choose(i,b){if(done)return;mark(i===idx,b)}
function tileClick(b){if(done||b.disabled)return;const parts=Array.from(word()[0]);if(b.dataset.letter!==parts[picked.length]){mark(false,b);return}picked.push(b.dataset.letter);b.disabled=true;$('typed').textContent=picked.join('');if(picked.length===parts.length)mark(true,b)}
function drawGroups(){const box=$('groups');box.replaceChildren();groups.forEach((g,i)=>{const b=document.createElement('button');b.textContent='ABCD'[i]+' '+g[0];b.className=i===groupNo?'active':'';b.onclick=()=>{groupNo=i;phase=2;idx=0;score=0;draw();history.replaceState(null,'','?group='+i+'&v=3')};box.append(b)});$('stage1').href='./station-explorer-demo.html?group='+groupNo+'&v=8'}
function draw(){done=false;picked=[];drawGroups();$('tab2').classList.toggle('active',phase===2);$('tab3').classList.toggle('active',phase===3);$('progress').textContent=groups[groupNo][0]+' · 第 '+(idx+1)+' / 6 題';$('score').textContent='完成 '+score+' 題';$('bar').style.width=idx/6*100+'%';$('next').disabled=true;$('next').textContent='下一題 ›';$('speak').disabled=false;$('feedback').textContent='';$('feedback').className='feedback';$('sceneTitle').textContent=groups[groupNo][1]+' · '+(phase===2?'情境任務':'自動售票機');$('sceneBadge').textContent=phase===2?'聽日文，從六個場景任務中作答':'聽日文，依序點選假名';$('question').textContent=phase===2?'📢 聽日文，選正確行動':'🎫 聽日文，拼出對應假名';$('help').textContent=phase===2?'每題六個選項，沒有時間限制':'提供中文意思，不直接顯示日文答案';const area=$('game');area.replaceChildren();
if(phase===2){const box=document.createElement('div');box.className='route';items().forEach((w,i)=>{const b=document.createElement('button');b.innerHTML='<span class="icon">'+w[2]+'</span><span class="label">'+w[3]+'</span>';b.onclick=()=>choose(i,b);box.append(b)});area.append(box)}
else{const box=document.createElement('div');box.className='ticket';box.innerHTML='<div class="machineTitle">🚉 TICKET MACHINE · きっぷ</div><div class="display"><div class="cn">提示：'+word()[1]+'</div><div class="jp" id="typed">＿ ＿</div></div><div class="tiles" id="tiles"></div><div class="ticketActions"><button id="clear">↺ 重新選字</button></div>';area.append(box);const parts=Array.from(word()[0]);const filler=Array.from('あかすけとみのるほへちえきタスバムロハぷ');const extra=filler.filter(c=>!parts.includes(c)).slice((idx*3)%12,(idx*3)%12+3);const opts=[...parts.map((v,i)=>[v,i]),...extra.map((v,i)=>[v,100+i])];opts.sort((a,b)=>((a[0].codePointAt(0)*3+a[1])%19)-((b[0].codePointAt(0)*3+b[1])%19));opts.forEach(([letter])=>{const b=document.createElement('button');b.textContent=letter;b.dataset.letter=letter;b.onclick=()=>tileClick(b);$('tiles').append(b)});$('clear').onclick=()=>draw()}}
function setPhase(p){phase=p;idx=0;score=0;draw()}
$('tab2').onclick=()=>setPhase(2);$('tab3').onclick=()=>setPhase(3);
$('next').onclick=()=>{if(!done)return;if(idx<5){idx++;draw();return}if(phase===2){setPhase(3);return}const box=$('game');box.innerHTML='<div class="done"><div style="font-size:42px">🎉</div><h2>本組三階段練習完成！</h2><p>可以選擇其他單字組繼續旅行。</p><button id="again">再練一次</button></div>';$('again').onclick=()=>setPhase(2);$('next').disabled=true;$('speak').disabled=true;$('question').textContent='🚉 '+groups[groupNo][0]+' 完成';$('help').textContent='試玩版不影響正式熟悉度';$('feedback').textContent=''};
draw();
</script></body></html>
