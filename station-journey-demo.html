<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日本電車旅行｜第二、三關</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#294e68;background:#dae9ee}button{font:inherit;touch-action:manipulation;cursor:pointer}main{max-width:520px;margin:auto;min-height:100dvh;padding:max(9px,env(safe-area-inset-top)) 11px max(12px,env(safe-area-inset-bottom));background:linear-gradient(#dbeeff,#fff4e6);display:flex;flex-direction:column;gap:9px}header{display:flex;align-items:center;gap:9px}.back{background:#fff;color:#47738c;text-decoration:none;border-radius:11px;padding:9px;font-size:12px;font-weight:800}h1{font-size:18px;margin:0}.sub{font-size:10px;color:#7890a1}.tabs{display:flex;gap:7px}.tab{flex:1;border:2px solid #c2d9df;border-radius:13px;padding:9px 3px;background:#ffffffad;color:#547488;font-size:12px;font-weight:900}.tab.active{background:#4c92aa;color:#fff;border-color:#4c92aa}.status{display:flex;justify-content:space-between;background:#fffdf5;border-radius:12px;padding:8px 12px;font-weight:800;font-size:12px}.bar{height:6px;border-radius:10px;background:#c6d7d8;overflow:hidden}.bar i{display:block;background:#60b58e;width:0;height:100%;transition:width .3s}.scene{position:relative;overflow:hidden;border-radius:19px;min-height:280px;flex:1;background:#cae4ec url('./%E6%98%A5%E6%97%A5%E6%AB%BB%E8%8A%B1%E9%90%B5%E9%81%93%E5%B0%8F%E9%8E%AE%E7%AB%99%E5%BB%A3%E5%A0%B4_%E7%B6%B2%E7%AB%99%E7%89%88.webp') center/cover;box-shadow:0 5px 14px #35617b34;border:3px solid white}.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#12394d55,transparent 52%);pointer-events:none}.sceneTitle{position:absolute;top:9px;left:9px;border-radius:20px;background:#fff9eddb;padding:7px 11px;font-weight:900;font-size:12px}.route{position:absolute;top:20%;left:9%;right:9%;display:flex;flex-direction:column;gap:11px}.route button{border:2px solid white;border-radius:14px;background:#fffdf0e8;box-shadow:0 4px 0 #557e8880;padding:12px 9px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}.route button .icon{font-size:26px}.route button .label{font-size:14px;flex:1;text-align:left}.route button:active{transform:translateY(2px)}.route button.wrong{background:#ffd7d0;border-color:#df7970;animation:shake .3s}.route button.correct{background:#ddf8e6;border-color:#66c28e}.sceneBadge{position:absolute;bottom:12px;left:12px;right:12px;color:white;font-size:12px;font-weight:800;text-shadow:0 1px 5px #234}.ticket{position:absolute;top:21%;left:9%;right:9%;padding:13px;border-radius:17px;background:#edf5ed;border:7px solid #4b6777;box-shadow:0 8px 0 #304556,0 14px 22px #273a3b55}.machineTitle{background:#3e748b;color:#fff;border-radius:8px;text-align:center;font-size:12px;padding:7px;font-weight:900;letter-spacing:.7px}.display{background:#233e47;margin:10px 0;border-radius:9px;color:#c6ffdb;min-height:74px;padding:11px;text-align:center}.display .jp{font-size:27px;font-weight:900;letter-spacing:3px;min-height:35px}.display .cn{font-size:11px;color:#e4f1ec}.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0}.tiles button{border:1px solid #b6cecd;background:#fff;border-radius:9px;min-width:50px;min-height:48px;padding:8px;font-weight:900;font-size:22px;color:#315f71;box-shadow:0 3px 0 #abbdbc}.tiles button:disabled{opacity:.24}.ticketActions{display:flex;gap:9px}.ticketActions button{flex:1;background:#dcece9;border:0;border-radius:9px;padding:9px;font-size:12px;font-weight:900;color:#346275}.bottom{background:#fffdf5;border-radius:16px;border:2px solid white;padding:11px}.question{text-align:center;font-size:16px;font-weight:900;line-height:1.45}.help{text-align:center;font-size:12px;color:#78919a;margin-top:4px}.feedback{text-align:center;margin-top:7px;font-size:13px;font-weight:900;min-height:20px}.feedback.good{color:#2d9b69}.feedback.bad{color:#cc625e}.buttons{display:flex;gap:8px;margin-top:8px}.buttons button{border:0;border-radius:10px;padding:12px 6px;font-weight:900;flex:1;background:#e3f1f1;color:#416b79}.buttons button.next{background:#4e99b7;color:white}.buttons button:disabled{background:#c5d2d3;color:#eff5f4}.done{margin:auto 10px;background:#fffcf3e9;padding:23px 16px;text-align:center;font-weight:900;border-radius:18px}.done p{font-size:13px;font-weight:500}.done button{border:0;background:#4c95ad;color:#fff;font-weight:900;border-radius:10px;padding:12px 18px}.mute{margin-left:auto;border:0;background:#fffded;border-radius:9px;padding:8px}.foot{text-align:center;font-size:10px;color:#728b95}@keyframes shake{30%{transform:translateX(-6px)}70%{transform:translateX(6px)}}@media(max-height:680px){main{gap:5px}.scene{min-height:245px}.route{top:16%;gap:7px}.route button{padding:8px}.ticket{top:12%;padding:8px}.display{margin:7px 0;min-height:60px}.tiles{margin:6px 0}.tiles button{min-height:40px}.bottom{padding:8px}.buttons{margin-top:4px}.buttons button{padding:9px}.foot{display:none}}</style></head>
<body><main><header><a class="back" href="./station-explorer-demo.html?v=7">‹ 第一關</a><div><div class="sub">JAPAN RAIL ADVENTURE · STATION</div><h1>🚉 日本電車旅行</h1></div><button id="mute" class="mute" title="切換答題音效">🔔</button></header><nav class="tabs"><button class="tab active" id="tab2">第二關｜搭車任務</button><button class="tab" id="tab3">第三關｜售票機</button></nav><div class="status"><span id="progress">任務 1 / 6</span><span id="score">完成 0 題</span></div><div class="bar"><i id="bar"></i></div><section class="scene" id="scene"><div class="sceneTitle" id="sceneTitle">🚏 尋找搭車路線</div><div id="game"></div><div class="sceneBadge" id="sceneBadge">櫻花車站｜聽指示完成旅行</div></section><section class="bottom"><div class="question" id="question"></div><div class="help" id="help"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="buttons"><button id="speak">🔊 播放日文</button><button class="next" id="next" disabled>下一題 ›</button></div></section><div class="foot">🧪 第二、三關試玩版｜不影響正式熟悉度</div></main>
<script>
const $=id=>document.getElementById(id);
const routes=[
 {jp:'みぎ',cn:'右邊',options:[['⬅️','往左走'],['➡️','往右走'],['⬆️','直走']],ans:1,tip:'要走哪個方向？'},
 {jp:'ひだり',cn:'左邊',options:[['⬅️','往左走'],['⬆️','直走'],['➡️','往右走']],ans:0,tip:'按照指示前進'},
 {jp:'まっすぐ',cn:'直走',options:[['↗️','往右轉'],['⬆️','直直向前'],['⬅️','往左走']],ans:1,tip:'找出正確路線'},
 {jp:'のる',cn:'搭乘',options:[['🚃','走上電車'],['🚶','離開車廂'],['🪑','在椅子等候']],ans:0,tip:'你準備搭車了'},
 {jp:'おりる',cn:'下車',options:[['🎫','去買票'],['🚉','從車廂走下月台'],['🚃','走進車廂']],ans:1,tip:'列車已經到站'},
 {jp:'のりかえ',cn:'轉乘',options:[['🔁','換到另一條線'],['🪑','留在原地'],['🏠','離開車站回家']],ans:0,tip:'下一段旅程怎麼走？'}
];
const tickets=[
 {jp:'きっぷ',cn:'車票',parts:['きっ','ぷ'],extra:['ぷ','きっ','か','と']},
 {jp:'えき',cn:'車站',parts:['え','き'],extra:['け','え','き','し']},
 {jp:'ホーム',cn:'月台',parts:['ホー','ム'],extra:['ム','ホー','メ','ハ']},
 {jp:'でぐち',cn:'出口',parts:['で','ぐ','ち'],extra:['ち','で','く','ぐ','ろ']},
 {jp:'のる',cn:'搭乘',parts:['の','る'],extra:['ろ','の','る','れ']},
 {jp:'バス',cn:'公車',parts:['バ','ス'],extra:['サ','バ','ツ','ス']}
];
let phase=2,idx=0,correct=0,answered=false,effectContext=null,effectsEnabled=true,spoken=null,selected=[];
function effect(type){if(!effectsEnabled)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!effectContext)effectContext=new A();const c=effectContext;if(c.state==='suspended')c.resume().catch(()=>{});const at=c.currentTime+.015;const pitches=type==='ok'?[[659,0,.1],[784,.11,.1],[1047,.22,.18]]:[[330,0,.13],[247,.14,.2]];pitches.forEach(([hz,dur,len])=>{const o=c.createOscillator(),g=c.createGain(),t=at+dur;o.type=type==='ok'?'sine':'triangle';o.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==='ok'?.045:.035,t+.016);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+len+.02)})}catch(e){}}
$('mute').onclick=()=>{effectsEnabled=!effectsEnabled;$('mute').textContent=effectsEnabled?'🔔':'🔕';if(effectsEnabled)effect('ok')};
function say(){const item=(phase===2?routes:tickets)[idx];if(!('speechSynthesis' in window)){$('help').textContent='無法播放語音：'+item.jp;return}try{const syn=speechSynthesis;syn.cancel();const u=new SpeechSynthesisUtterance(item.jp);u.lang='ja-JP';u.rate=.83;u.volume=.78;const v=syn.getVoices().find(x=>x.lang.toLowerCase()==='ja-jp')||syn.getVoices().find(x=>x.lang.startsWith('ja'));if(v)u.voice=v;spoken=u;u.onerror=()=>{$('help').textContent='語音無法播放：'+item.jp};syn.speak(u)}catch(e){$('help').textContent='語音無法播放：'+item.jp}}
$('speak').onclick=say;
function mark(ok,el){effect(ok?'ok':'bad');$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=ok?'✅ 正確！':'❌ 再試一次！';if(el){el.classList.add(ok?'correct':'wrong');if(!ok)setTimeout(()=>el.classList.remove('wrong'),400)}if(ok){answered=true;correct++;$('score').textContent='完成 '+correct+' 題';$('next').disabled=false;$('next').textContent=idx===5?(phase===2?'前往第三關 →':'完成旅程 ✓'):'下一題 ›';$('question').textContent='✅ '+(phase===2?routes[idx]:tickets[idx]).jp+' · '+(phase===2?routes[idx]:tickets[idx]).cn}}
function choose(i,el){if(answered)return;mark(i===routes[idx].ans,el)}
function addTile(i,button){if(answered||button.disabled)return;const data=tickets[idx];const expected=data.parts[selected.length];if(button.dataset.part!==expected){mark(false,button);return}selected.push(button.dataset.part);button.disabled=true;updateDisplay();if(selected.length===data.parts.length)mark(true,button)}
function updateDisplay(){const d=$('typed');if(d)d.textContent=selected.join('')||'＿ ＿'}
function resetTicket(){if(answered)return;selected=[];draw()}
function draw(){answered=false;selected=[];const data=(phase===2?routes:tickets)[idx];$('tab2').classList.toggle('active',phase===2);$('tab3').classList.toggle('active',phase===3);$('progress').textContent='第 '+idx%6+1+' / 6 題';$('score').textContent='完成 '+correct+' 題';$('bar').style.width=(idx/6*100)+'%';$('next').disabled=true;$('next').textContent='下一題 ›';$('feedback').textContent='';$('feedback').className='feedback';$('question').textContent=phase===2?'📢 聽站內指示，選擇正確行動':'🎫 聽日文，依序選假名完成車票';$('help').textContent=phase===2?'選出正確的路線或乘車動作':'選擇正確假名，不需要計時';$('sceneTitle').textContent=phase===2?'🚏 月台搭車任務':'🎫 自動售票機';$('sceneBadge').textContent=phase===2?'依照廣播完成 6 次旅行任務':'輸入正確假名，完成 6 張練習車票';
const area=$('game');area.replaceChildren();
if(phase===2){const box=document.createElement('div');box.className='route';data.options.forEach((o,i)=>{const b=document.createElement('button');b.innerHTML='<span class="icon">'+o[0]+'</span><span class="label">'+o[1]+'</span><span>›</span>';b.onclick=()=>choose(i,b);box.appendChild(b)});area.appendChild(box)}
else{const box=document.createElement('div');box.className='ticket';box.innerHTML='<div class="machineTitle">🚉 きっぷ · TICKET MACHINE</div><div class="display"><div class="cn">請依序輸入假名</div><div class="jp" id="typed">＿ ＿</div></div><div class="tiles" id="tiles"></div><div class="ticketActions"><button id="clear" type="button">↺ 重新選字</button></div>';area.appendChild(box);data.extra.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p;b.dataset.part=p;b.onclick=()=>addTile(i,b);$('tiles').appendChild(b)});$('clear').onclick=resetTicket}
}
function finish(){const box=document.createElement('div');box.className='done';box.innerHTML='<div style="font-size:40px">🎉</div><h2>日本電車旅行完成！</h2><p>你已經練習搭車路線和自動售票機假名輸入。</p><button id="again">重新挑戰</button>';const area=$('game');area.replaceChildren(box);$('again').onclick=()=>switchPhase(2);$('question').textContent='🚉 三關玩法範例完成';$('help').textContent='這是獨立試玩，不影響正式熟悉度';$('feedback').textContent='';$('next').disabled=true;$('speak').disabled=true}
function switchPhase(p){phase=p;idx=0;correct=0;$('speak').disabled=false;draw()}
$('tab2').onclick=()=>switchPhase(2);$('tab3').onclick=()=>switchPhase(3);
$('next').onclick=()=>{if(!answered)return;if(idx===5){if(phase===2)switchPhase(3);else finish()}else{idx++;draw()}};
draw();
</script></body></html>
